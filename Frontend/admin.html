<!DOCTYPE html>
<html>
<body style="background:#000;color:#fff;text-align:center">

<h2>Admin Login</h2>
<input id="email"><br>
<input id="pass" type="password"><br>
<button onclick="login()">Login</button>

<div id="panel"></div>

<script>
let key="";

function login(){
fetch("/api/admin/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({email:email.value,password:pass.value})
}).then(()=>{
key=pass.value;
load();
});
}

function load(){
fetch("/api/admin/withdraws",{headers:{key}})
.then(r=>r.json())
.then(data=>{
panel.innerHTML=data.map(u=>u.withdrawRequests.map((w,i)=>`
<div>
<p>${u.email}</p>
<p>${w.amount}</p>
<p>${w.address}</p>
<button onclick="pay('${u._id}',${i})">Paid</button>
<button onclick="confirm('${u._id}')">Confirm Deposit</button>
</div>
`).join("")).join("");
});
}

function pay(id,i){
fetch("/api/admin/mark-paid",{
method:"POST",
headers:{"Content-Type":"application/json",key},
body:JSON.stringify({userId:id,index:i})
}).then(load);
}

function confirm(id){
fetch("/api/admin/confirm-deposit",{
method:"POST",
headers:{"Content-Type":"application/json",key},
body:JSON.stringify({userId:id})
}).then(load);
}
</script>

</body>
</html>
