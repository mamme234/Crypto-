<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
</head>
<body>

<h2>Admin Panel</h2>

<button onclick="load()">Load</button>

<h3>Users</h3>
<div id="users"></div>

<h3>Withdraws</h3>
<div id="wd"></div>

<script>

const API="https://crypto-4bbj.onrender.com";

async function load(){

let u=await fetch(API+"/api/admin/users");
let users=await u.json();

users.innerHTML=users.map(x=>
`<div>${x.name} - ${x.coins}</div>`
).join("");

let w=await fetch(API+"/api/admin/withdraws");
let wd=await w.json();

document.getElementById("wd").innerHTML=
wd.map(x=>
`<div>${x.amount} <button onclick="a('${x._id}')">Approve</button></div>`
).join("");

}

async function a(id){
await fetch(API+"/api/admin/approve",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id})
});
load();
}

</script>

</body>
</html>
