<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
</head>
<body>

<h2>Users</h2>
<div id="users"></div>

<script>
fetch("/api/admin/users")
.then(r=>r.json())
.then(data=>{
document.getElementById("users").innerHTML=
data.map(u=>`
<div style="margin:10px;padding:10px;background:#111;color:#fff">
${u.email} - ${u.coins}
</div>
`).join("");
});
</script>

</body>
</html>
