<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Tap Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);
color:white;
}

.screen{
display:none;
padding:15px;
min-height:100vh;
box-sizing:border-box;
padding-bottom:80px;
}

.active{
display:block;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.75);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
border:none;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
<h2>Home</h2>
<p id="name">User</p>
<p id="uname">@user</p>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
<h2>Profile</h2>
<p id="pUser">Loading...</p>
</div>

<!-- DEPOSIT -->
<div id="deposit" class="screen">
<h2>Deposit</h2>
<p>Wallet Address Here</p>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('deposit')">Deposit</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
/* Telegram */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user || null;

/* UI SET */
function setUserUI(){
  document.getElementById("name").innerText =
    user?.first_name || "Guest";

  document.getElementById("uname").innerText =
    "@" + (user?.username || "guest");

  document.getElementById("pUser").innerText =
    user ? "ID: " + user.id : "No Telegram user";
}

/* NAV FIX */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("active");
    s.style.display = "none";
  });

  const page = document.getElementById(id);
  if(page){
    page.style.display = "block";
    page.classList.add("active");
  }
}

/* START */
window.addEventListener("load", ()=>{
  setUserUI();
  if(tg) tg.expand();
});
</script>

</body>
</html>
