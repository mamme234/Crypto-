<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ads Earn App</title>
</head>

<body style="text-align:center;font-family:sans-serif;">

<h2>💰 Ads Earn App</h2>

<h3 id="balance">Coins: 0</h3>

<button onclick="watchAd1()">Watch Ad 1 (+50)</button>
<br><br>

<button onclick="watchAd2()">Watch Ad 2 (+50)</button>

<br><br>

<input id="wallet" placeholder="USDT Wallet">
<input id="amount" placeholder="Amount">

<br><br>

<button onclick="withdraw()">Withdraw</button>

<!-- ===== YOUR AD SCRIPTS ===== -->

<script>
(function(s){
  s.dataset.zone='11013501';
  s.src='https://al5sm.com/tag.min.js';
})(
  [document.documentElement, document.body]
    .filter(Boolean)
    .pop()
    .appendChild(document.createElement('script'))
);
</script>

<script>
(function(s){
  s.dataset.zone='11013511';
  s.src='https://al5sm.com/tag.min.js';
})(
  [document.documentElement, document.body]
    .filter(Boolean)
    .pop()
    .appendChild(document.createElement('script'))
);
</script>

<script>

const userId = Telegram.WebApp.initDataUnsafe.user.id;

let coins = 0;

async function loadUser(){

  let res = await fetch(`/user/${userId}`);
  let data = await res.json();

  coins = data.coins;
  document.getElementById("balance").innerText = "Coins: " + coins;
}

loadUser();

async function reward(){
  let res = await fetch("/ads", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId})
  });

  let data = await res.json();

  if(data.coins !== undefined){
    coins = data.coins;
    document.getElementById("balance").innerText = "Coins: " + coins;
  } else {
    alert(data.message);
  }
}

function watchAd1(){
  reward();
}

function watchAd2(){
  reward();
}

async function withdraw(){

  let wallet = document.getElementById("wallet").value;
  let amount = document.getElementById("amount").value;

  let res = await fetch("/withdraw",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      userId,
      wallet,
      amount:Number(amount)
    })
  });

  let data = await res.json();
  alert(data.message);
}

</script>

</body>
</html>
