<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto</title>

<style>
body{
margin:0;
font-family:'Segoe UI';
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
}

.header{
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.card{
background:rgba(255,255,255,0.06);
border-radius:18px;
padding:18px;
margin:12px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:20px;
color:#ff9800;
}

.tap{
width:170px;
height:170px;
border-radius:50%;
margin:25px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-top:10px;
background:#229ED9;
color:#fff;
}
</style>
</head>

<body>

<div class="header">💰 Crypto</div>

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div style="text-align:center">
<img id="photo" style="width:70px;height:70px;border-radius:50%">
<h3 id="name"></h3>
</div>

<div class="tap" onclick="tap()">🪙</div>

<div class="card">
<button onclick="convert()">Convert Coins</button>
<button onclick="withdraw()">Withdraw</button>
<button onclick="unlock()">Unlock ($5)</button>
</div>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board"></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

// TELEGRAM LOGIN
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user;

if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(res=>res.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

// LOAD USER
async function load(){

const res=await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
});

const u=await res.json();

if(!u || u.message) return;

coins.innerText=u.coins;
usdt.innerText=u.usdt;
refs.innerText=u.referrals;
level.innerText=Math.floor(u.coins/5000)+1;
name.innerText=u.name;

if(u.photo) photo.src=u.photo;

// leaderboard
const lb = await fetch(API+"/api/leaderboard").then(r=>r.json());

board.innerHTML = lb.map(u=>`
<div>${u.name} - ${u.coins}</div>
`).join("");
}

// TAP
async function tap(){
await fetch(API+"/api/tap",{
method:"POST",
headers:{Authorization:"Bearer "+token}
});
load();
}

// CONVERT
async function convert(){
const r = await fetch(API+"/api/convert",{
method:"POST",
headers:{Authorization:"Bearer "+token}
});
alert((await r.json()).message);
load();
}

// WITHDRAW
async function withdraw(){

const address=prompt("Wallet address");
const amount=prompt("Amount");

const res=await fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({address,amount})
});

alert((await res.json()).message);
load();
}

// UNLOCK
async function unlock(){
await fetch(API+"/api/unlock",{
method:"POST",
headers:{Authorization:"Bearer "+token}
});
alert("Unlocked");
}

load();

</script>

</body>
</html>
