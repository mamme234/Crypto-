app.get("/", (req,res)=>{
res.send(`
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earn USDT Pro</title>

<script src="//libtl.com/sdk.js" data-zone="10892289" data-sdk="show_10892289"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.header{
background:#1e293b;
padding:15px;
text-align:left;
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.card{
background:#1e293b;
margin:15px;
padding:15px;
border-radius:12px;
}

button{
width:90%;
padding:12px;
margin:6px;
border:none;
border-radius:10px;
font-size:16px;
}

.ad{background:#22c55e;color:white}
.bonus{background:#3b82f6;color:white}
.withdraw{background:#f59e0b;color:white}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="avatar" id="avatar">U</div>
  <div>
    <div id="tgName">Telegram User</div>
    <small>ID: <span id="uid"></span></small>
  </div>
</div>

<!-- BALANCE -->
<div class="card">
  <h3>💰 Balance</h3>
  <p>USDT: <b>$<span id="usdt">0</span></b></p>
  <p>Coins: <span id="coins">0</span></p>
  <p>Level: <span id="level">Bronze</span></p>
</div>

<!-- ADS -->
<button class="ad" onclick="watchAd()">▶ Watch Ad +0.03$</button>

<!-- BONUS -->
<button class="bonus" onclick="bonus()">🎁 Daily Bonus</button>

<!-- WITHDRAW -->
<div class="card">
  <h3>💸 Withdraw</h3>

  <input id="wallet" placeholder="USDT Wallet"
    style="width:90%;padding:10px;border-radius:8px;border:none"><br><br>

  <input id="amount" placeholder="Amount"
    style="width:90%;padding:10px;border-radius:8px;border:none"><br><br>

  <button class="withdraw" onclick="withdraw()">Withdraw</button>
</div>

<script>

// ================= TELEGRAM PROFILE =================
let userId = "test";
let tgName = "User";
let avatar = "U";

if(window.Telegram && Telegram.WebApp){
  const user = Telegram.WebApp.initDataUnsafe.user;

  if(user){
    userId = user.id;
    tgName = user.first_name || "User";
    avatar = (user.first_name || "U")[0];
  }
}

document.getElementById("uid").innerText = userId;
document.getElementById("tgName").innerText = tgName;
document.getElementById("avatar").innerText = avatar;

// ================= LOAD PROFILE =================
async function load(){

  let res = await fetch("/profile/"+userId);
  let d = await res.json();

  document.getElementById("usdt").innerText = d.usdt.toFixed(2);
  document.getElementById("coins").innerText = d.coins;
  document.getElementById("level").innerText = d.level;
}

load();

// ================= REWARDED ADS =================
function watchAd(){

  show_10892289().then(()=>{

    fetch("/ads",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({userId})
    }).then(()=>load());

    alert("🎉 +0.03$ earned!");

  }).catch(e=>{
    alert("Ad error");
  });
}

// ================= BONUS =================
async function bonus(){

  let res = await fetch("/bonus",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId})
  });

  let d = await res.json();
  alert(d.message);
  load();
}

// ================= WITHDRAW =================
async function withdraw(){

  let wallet = document.getElementById("wallet").value;
  let amount = document.getElementById("amount").value;

  let res = await fetch("/withdraw",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      userId,
      wallet,
      amount:Number(amount)
    })
  });

  let d = await res.json();
  alert(d.message);
}

</script>

</body>
</html>
