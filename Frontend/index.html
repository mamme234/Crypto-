<!DOCTYPE html>
<html>
<head>
<title>Earn App</title>
</head>
<body style="background:#000;color:#fff;text-align:center">

<h2>Coins: <span id="coins">0</span></h2>
<h2>USDT: <span id="usdt">0</span></h2>

<button onclick="tap()">Tap</button>
<button onclick="daily()">Daily</button>
<button onclick="convert()">Convert</button>
<button onclick="deposit()">Unlock $5</button>
<button onclick="withdraw()">Withdraw</button>

<script>
const API="";
let token=localStorage.getItem("token");

async function api(url,method="GET",body){
const res=await fetch(API+url,{
method,
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:body?JSON.stringify(body):null
});
return res.json();
}

async function load(){
const d=await api("/api/user");
coins.innerText=d.coins;
usdt.innerText=d.usdt;
}

async function tap(){await api("/api/user/tap","POST");load();}
async function daily(){await api("/api/user/daily","POST");load();}
async function convert(){await api("/api/user/convert","POST");load();}
async function deposit(){await api("/api/user/deposit","POST");alert("Wait admin");}
async function withdraw(){
const addr=prompt("Binance address");
const amt=prompt("Amount");
await api("/api/user/withdraw","POST",{amount:amt,address:addr});
alert("Request sent");
}

load();
</script>

</body>
</html>
