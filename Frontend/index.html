<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);

}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:48px;
height:48px;
border-radius:50%;
border:2px solid #facc15;
box-shadow:0 0 15px rgba(250,204,21,0.5);
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
margin-top:12px;
}

.box{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:14px;
width:40%;
text-align:center;
backdrop-filter:blur(8px);
}

.box strong{
display:block;
font-size:20px;
color:#facc15;
}

/* TAP */
.tap{
display:flex;
justify-content:center;
margin-top:70px;
}

.tap button{
width:220px;
height:220px;
border-radius:50%;
border:none;
font-size:22px;
font-weight:bold;
color:#111;
background:radial-gradient(circle,#ffe066,#facc15);
box-shadow:0 0 40px rgba(250,204,21,0.6);
}

/* SCREEN */
.screen{
display:none;
padding:15px;
animation:fade 0.2s ease;
}

.active{display:block;}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.6);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
border:none;
}

/* PROFILE */
.profileCard{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:18px;
margin-top:10px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
}

.profileHeader{
display:flex;
align-items:center;
gap:10px;
}

.profileHeader img{
width:60px;
height:60px;
border-radius:50%;
border:2px solid gold;
}

.badge{
background:gold;
color:black;
padding:3px 8px;
border-radius:10px;
font-size:12px;
margin-left:10px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
margin-top:8px;
}
</style>
</head>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API = "https://crypto-4bbj.onrender.com";

let state = {coins:0,usdt:0};

const tg = window.Telegram?.WebApp;

const user = tg?.initDataUnsafe?.user || {
id: 1,
first_name: "Guest",
username: "guest"
};

/* LOAD USER */
async function loadUser(){

if(!user) return;

let ref = new URLSearchParams(window.location.search).get("ref");

let url = API + "/user/" + user.id;
if(ref) url += "/" + ref;

let res = await fetch(url);
let data = await res.json();

state.coins = data.coins;
state.usdt = data.usdt;

render();
updateTasks(data.tasks || []);
}

/* RENDER */
function render(){
document.getElementById("coins").innerText = Math.floor(state.coins);
document.getElementById("usdt").innerText = state.usdt.toFixed(3);
}

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* TAP */
let lastAdTime = 0;

function canShowAd(){
  return Date.now() - lastAdTime > 5000;
}

function ads(type="rewarded"){

if(typeof show_10892289 !== "function"){
  alert("Ads not ready");
  return;
}

if(!canShowAd()){
  alert("Wait 5 sec");
  return;
}

lastAdTime = Date.now();

if(type === "rewarded"){

show_10892289().then(()=>{

state.coins += 300;
state.usdt += 0.003;
render();

alert("🎉 +300 coins");

});

}

else if(type === "popup"){

show_10892289("pop").then(()=>{

state.coins += 150;
render();

alert("🎁 +150 coins");

});

}

else if(type === "double"){

show_10892289().then(()=>{

state.coins *= 2;
render();

alert("🔥 Doubled");

});

}

}
/* TASKS */
function updateTasks(tasks){
if(tasks.includes("telegram")){
tgTask.innerText="Completed ✅"; tgTask.disabled=true;
}
if(tasks.includes("youtube")){
ytTask.innerText="Completed ✅"; ytTask.disabled=true;
}
if(tasks.includes("tiktok")){
ttTask.innerText="Completed ✅"; ttTask.disabled=true;
}
}

async function task(type){

let links = {
telegram:"https://t.me/gangs234",
youtube:"https://youtube.com/@Mamme234",
tiktok:"https://tiktok.com/@mammeliyas"
};

window.open(links[type],"_blank");

let res = await fetch(API+"/task",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:user.id,type})
});

let data = await res.json();

state.coins = data.coins;
state.usdt = data.usdt;

render();
alert(data.message);

loadUser();
}

/* ADS */
function ads(){

show_10892289().then(() => {

    // 🎁 MAIN REWARD (coins after ad)
    state.coins += 300;
    state.usdt += 0.003;

    render();
    alert("🎉 Reward received!");

}).catch(() => {
    alert("❌ Ad not completed");
});

                                                                     }function popupAd(){

show_10892289('pop').then(() => {

    // 🎁 smaller reward
    state.coins += 150;

    render();
    alert("🎁 Popup reward received!");

}).catch(() => {
    alert("Ad failed or closed");
});

    }
function doubleReward(){

show_10892289().then(()=>{

state.coins *= 2;
render();

alert("🔥 Coins doubled!");

});

}
/* WITHDRAW */
async function withdraw(){

let wallet=document.getElementById("wallet").value;
let amount=parseFloat(document.getElementById("amount").value);

let res = await fetch(API+"/withdraw",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:user.id,wallet,amount})
});

let data = await res.json();
alert(data.message);
}

/* COPY */
function copyRef(){
navigator.clipboard.writeText(document.getElementById("refLink").value);
alert("Copied");
}

function copyWallet(){
navigator.clipboard.writeText(document.getElementById("depWallet").value);
alert("Copied");
}

/* TELEGRAM USER */
if(user){
document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"user");
document.getElementById("pName").innerText=user.first_name;
document.getElementById("pUser").innerText="ID: "+user.id;

document.getElementById("refLink").value =
"https://t.me/Studybuddy_2025Bot?start="+user.id;

if(user.photo_url){
photo.src=user.photo_url;
pPhoto.src=user.photo_url;
}
}

/* START */
window.addEventListener("load", () => {

loadUser();

// tap events
document.getElementById("tapBtn").addEventListener("click", tap);
document.getElementById("tapBtn").addEventListener("touchstart", tap, {passive:false});

/* =========================
   🚀 ADS UPGRADE SYSTEM
========================= */

let lastAdTime = 0;
const AD_COOLDOWN = 5000; // 5 sec cooldown

function canShowAd(){
  return Date.now() - lastAdTime > AD_COOLDOWN;
}

/* MAIN ADS FUNCTION */
function ads(type = "rewarded"){

if(typeof show_10892289 !== "function"){
  alert("❌ Ads not loaded");
  return;
}

if(!canShowAd()){
  alert("⏳ Please wait before next ad");
  return;
}

lastAdTime = Date.now();

/* =========================
   🎯 REWARDED AD
========================= */
if(type === "rewarded"){

show_10892289().then(() => {

  state.coins += 300;
  state.usdt += 0.003;

  render();
  alert("🎉 +300 coins reward");

}).catch(() => {
  alert("❌ Ad not completed");
});

}

/* =========================
   🎯 POPUP AD
========================= */
else if(type === "popup"){

show_10892289("pop").then(() => {

  state.coins += 150;

  render();
  alert("🎁 +150 popup reward");

}).catch(() => {
  alert("❌ Popup closed");
});

}

/* =========================
   🎯 DOUBLE REWARD AD
========================= */
else if(type === "double"){

show_10892289().then(() => {

  state.coins *= 2;

  render();
  alert("🔥 Coins doubled!");

}).catch(() => {
  alert("❌ Ad not completed");
});

}

/* =========================
   🎯 IN-APP ADS
========================= */
else if(type === "inApp"){

show_10892289({
  type: "inApp",
  inAppSettings: {
    frequency: 2,
    capping: 0.1,
    interval: 30,
    timeout: 5,
    everyPage: false
  }
}).catch(()=>{});

}

  }
</script>
