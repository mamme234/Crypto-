<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto App</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
margin:10px;
border-radius:18px;
}

.tap{
width:170px;
height:170px;
border-radius:50%;
margin:20px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:#229ED9;
color:white;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{flex:1;border-radius:0;}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
<div class="card">
<h3>💰 Balance: <span id="usdt">0</span> USDT</h3>
<h4>👥 Referrals: <span id="refs">0</span></h4>
</div>

<div class="tap" onclick="tap()">TAP</div>

<div class="card">
<button onclick="daily()">Daily Task</button>
</div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:80px;height:80px;border-radius:50%">
<h3 id="name"></h3>
</div>

<div class="card">
<h3>🔗 Referral Link</h3>
<p id="refLink"></p>
<button onclick="copyLink()">Copy</button>
</div>

<div class="card">
<h3>🎯 Social Tasks</h3>
<button onclick="task('telegram')">Telegram</button>
<button onclick="task('tiktok')">TikTok</button>
<button onclick="task('youtube')">YouTube</button>
</div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>💳 Deposit</h3>
<p id="wallet"></p>
</div>

<div class="card">
<button onclick="unlock()">Pay 5 USDT Unlock</button>
<button onclick="withdraw()">Withdraw</button>
</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

const tg=window.Telegram.WebApp;
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

async function load(){

const u=await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
}).then(r=>r.json());

usdt.innerText=Number(u.usdt).toFixed(3);
refs.innerText=u.referrals;
name.innerText=u.name;

const w=await fetch(API+"/api/wallet").then(r=>r.json());
wallet.innerText=w.ton;

// referral link
refLink.innerText=`https://t.me/Studybuddy_2025Bot?start=${tg.initDataUnsafe.user.id}`;

if(u.photo) photo.src=u.photo;
}

async function tap(){
await fetch(API+"/api/tap",{method:"POST",headers:{Authorization:"Bearer "+token}});
load();
}

async function task(type){
await fetch(API+"/api/task",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({type})
});
load();
}

function copyLink(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

async function unlock(){
alert((await fetch(API+"/api/unlock",{method:"POST",headers:{Authorization:"Bearer "+token}}).then(r=>r.json())).message);
load();
}

async function withdraw(){
const a=prompt("Address");
const b=prompt("Amount");

alert((await fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({address:a,amount:b})
}).then(r=>r.json())).message);

load();
}

load();

</script>

</body>
</html>
