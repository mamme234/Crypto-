<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap Earn App</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
margin:10px;
border-radius:16px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{display:block;font-size:20px;color:#ff9800;}

.tap{
width:230px;
height:230px;
border-radius:50%;
margin:25px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
font-weight:bold;
box-shadow:0 0 25px rgba(255,152,0,0.4);
user-select:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
background:#229ED9;
color:white;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{flex:1;border-radius:0;}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" onclick="tap(2)">✋✋</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:80px;height:80px;border-radius:50%">
<h3 id="name"></h3>
</div>

<div class="card">
<h3>🔗 Referral Link</h3>
<p id="refLink"></p>
<button onclick="copyLink()">Copy</button>
</div>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board"></div>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>💸 Withdraw Rules</h3>
<p>Min 20 USDT</p>
<p>10 referrals OR unlock</p>
</div>

<div class="card">
<button onclick="withdraw()">Withdraw</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

const tg=window.Telegram.WebApp;
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

async function load(){

const u=await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
}).then(r=>r.json());

coins.innerText=u.coins;
usdt.innerText=Number(u.usdt).toFixed(3);
refs.innerText=u.referrals;
level.innerText=Math.floor((u.coins + u.usdt*1000)/1000)+1;

name.innerText=u.name;

// referral link with name
refLink.innerText=`👤 ${u.name}\nhttps://t.me/Studybuddy_2025Bot?start=${tg.initDataUnsafe.user.id}`;

if(u.photo) photo.src=u.photo;

// leaderboard
const lb=await fetch(API+"/api/leaderboard").then(r=>r.json());
board.innerHTML=lb.map(x=>`<div>${x.name} - ${x.coins}</div>`).join("");
}

async function tap(fingers){
await fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});
load();
}

function copyLink(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

async function withdraw(){
const a=prompt("Address");
const b=prompt("Amount");

const r=await fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({address:a,amount:b})
});

alert((await r.json()).message);
load();
}

load();

</script>

</body>
  </html>
