<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<script src="https://libtl.com/sdk.js"
data-zone="3304242"
data-sdk="show_3304242"></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{text-align:center;}
.stat strong{display:block;font-size:22px;color:#ff9800;}

.level-box{
margin:10px;
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.05);
}

.progress{
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:linear-gradient(90deg,#ff9800,#ffd54f);
width:10%;
}

.tap{
width:260px;
height:260px;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8);
}

.task-btn{
background:linear-gradient(135deg,#229ED9,#0072ff);
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
color:#fff;
font-weight:bold;
width:100%;
}

.copy-btn{
background:linear-gradient(135deg,#ff9800,#ff5722);
padding:12px;
border:none;
border-radius:10px;
color:#fff;
margin-top:10px;
width:100%;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="level-box">
<h3>Level Progress</h3>
<div class="progress">
<div class="progress-fill" id="progressBar"></div>
</div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/512px-Bitcoin.svg.png">
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:90px;height:90px;border-radius:50%;border:3px solid #ff9800;">
<h3 id="username"></h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>Your Referral</h3>
<p id="refLink"></p>
<button class="copy-btn" onclick="copyRef()">Copy Link</button>
</div>

<div class="card">
<h3>🔥 Social Tasks</h3>
<button class="task-btn" onclick="task('telegram')">Join Telegram</button>
<button class="task-btn" onclick="task('tiktok')">Follow TikTok</button>
<button class="task-btn" onclick="task('youtube')">Subscribe YouTube</button>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Withdraw Rules</h3>
<p>• Minimum withdraw: 20 USDT</p>
<p>• Need 10 referrals OR deposit 5 USDT</p>
</div>

<div class="card">
<h3>Deposit Wallet</h3>
<p id="wallet"></p>
<button class="copy-btn" onclick="copyWallet()">Copy Address</button>
</div>

<div class="card">
<h3>Withdraw</h3>

<input id="wAddress" placeholder="Your wallet address"
style="width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;">

<input id="wAmount" placeholder="Amount (USDT)"
style="width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;">

<button class="copy-btn" onclick="withdraw()">Submit Withdraw</button>

</div>

</div>

<!-- ADS -->
<div id="ads" class="screen">

<div class="card" style="text-align:center">
<h3>💰 Watch Ads & Earn</h3>
<button class="task-btn" onclick="watchAdReward()">Watch Ad</button>
<p id="adTimer"></p>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('ads')">Ads</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0;
let refsVal=0;
let adCooldown=false;

/* SCREEN */
function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* FIX: STATS (USDT + LEVEL) */
function updateStats(){
document.getElementById("coins").innerText = coinsVal;

let usdt = Math.floor(coinsVal / 1000);
document.getElementById("usdt").innerText = usdt;

document.getElementById("level").innerText = Math.floor(coinsVal / 1000) + 1;
}

/* FIX: TAP (NO DOUBLE COUNT BUG) */
let lastTap=0;

tapArea.addEventListener("touchstart",(e)=>{

let now=Date.now();
if(now-lastTap<120) return;
lastTap=now;

let fingers=Math.min(e.touches?.length||1,4);

coinsVal += fingers;
updateStats();

});

/* PROFILE */
const tg = window.Telegram?.WebApp;
if(tg) tg.expand();

const user = tg?.initDataUnsafe?.user;

if(user){
username.innerText=user.first_name;
userid.innerText="ID:"+user.id+(user.username?" | @"+user.username:"");
refLink.innerText="https://t.me/Studybuddy_2025Bot?start="+user.id;

if(user.photo_url) photo.src=user.photo_url;
}

/* TASK */
function task(type){
let url=
type==="telegram"
?"https://t.me/gangs234"
:type==="tiktok"
?"https://tiktok.com"
:"https://youtube.com";
window.open(url,"_blank");
}

/* COPY */
function copyRef(){
navigator.clipboard.writeText(refLink.innerText);
}

/* WITHDRAW */
function withdraw(){
fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
address:wAddress.value,
amount:wAmount.value
})
});
}

/* ADS FIX */
function watchAdReward(){

if(adCooldown){
alert("Wait 60s");
return;
}

if(typeof show_3304242==="function"){

let ad=show_3304242();

if(ad && ad.then){
ad.then(giveReward).catch(()=>alert("No ads"));
}else{
giveReward();
}

}else{
alert("Ad not ready");
}

}

function giveReward(){

adCooldown=true;

coinsVal+=300;
updateStats();

let t=60;
adTimer.innerText="Next ad in: "+t+"s";

let timer=setInterval(()=>{

t--;
adTimer.innerText="Next ad in: "+t+"s";

if(t<=0){
clearInterval(timer);
adCooldown=false;
adTimer.innerText="Ready";
}

},1000);

}

</script>

</body>
  </html>
