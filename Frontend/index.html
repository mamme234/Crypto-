<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<!-- ✅ MONETAG (ADDED ONLY) -->
<script src='//libtl.com/sdk.js' data-zone='10892289' data-sdk='show_10892289'></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

.level-box{
margin:10px;
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.05);
}

.progress{
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:linear-gradient(90deg,#ff9800,#ffd54f);
width:10%;
}

.tap{
width:260px;
height:260px;
margin:0;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8);
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{filter:brightness(1);}
to{filter:brightness(1.4);}
}

.task-btn{
background:linear-gradient(135deg,#229ED9,#0072ff);
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
color:#fff;
font-weight:bold;
width:100%;
}

.copy-btn{
background:linear-gradient(135deg,#ff9800,#ff5722);
padding:12px;
border:none;
border-radius:10px;
color:#fff;
margin-top:10px;
width:100%;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}

/* ================= NEW ADS SCREEN ================= */
.ads-box{
text-align:center;
padding:20px;
}

.ads-btn{
background:linear-gradient(135deg,#00c6ff,#0072ff);
padding:15px;
border:none;
border-radius:12px;
color:white;
font-weight:bold;
width:100%;
margin-top:20px;
}
</style>
</head>

<body>

<!-- HOME (UNCHANGED) -->
<div id="home" class="screen active">
<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="level-box">
<h3>Level Progress</h3>
<div class="progress">
<div class="progress-fill" id="progressBar"></div>
</div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/512px-Bitcoin.svg.png">
</div>
</div>

<!-- PROFILE (UNCHANGED) -->
<div id="profile" class="screen">
<div class="card" style="text-align:center">
<img id="photo" style="width:90px;height:90px;border-radius:50%;border:3px solid #ff9800;">
<h3 id="username"></h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>Your Referral</h3>
<p id="refLink"></p>
<button class="copy-btn" onclick="copyRef()">Copy Link</button>
</div>
</div>

<!-- WITHDRAW (UNCHANGED) -->
<div id="withdraw" class="screen">
<div class="card">
<h3>Withdraw</h3>
<input id="wAddress" placeholder="Wallet address" style="width:100%;padding:10px;">
<input id="wAmount" placeholder="Amount" style="width:100%;padding:10px;margin-top:10px;">
<button class="copy-btn" onclick="withdraw()">Submit</button>
</div>
</div>

<!-- ================= NEW ADS SCREEN ================= -->
<div id="ads" class="screen">

<div class="card ads-box">
<h2>💰 Watch Ads & Earn</h2>
<p>Earn coins by watching ads</p>

<button class="ads-btn" onclick="watchAdReward()">
▶ Watch Monetag Ad
</button>

</div>

</div>

<!-- NAV (UPDATED ONLY ADD ADS BUTTON) -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('ads')">Ads</button>
</div>

<script>

let coinsVal = 0;
let adCooldown = false;

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* TAP */
tapArea.addEventListener("touchstart",(e)=>{
let f = e.touches?.length || 1;
coinsVal += Math.min(f,4);
coins.innerText = coinsVal;
});

/* ================= MONETAG ADS (ADDED ONLY) ================= */

function watchAdReward(){

if(adCooldown){
alert("Wait 60 seconds");
return;
}

if(typeof show_10892289 !== "function"){
alert("Ads not ready");
return;
}

adCooldown = true;
setTimeout(()=> adCooldown = false, 60000);

show_10892289({type:'inApp'}).then(()=>{

let reward = 310 + Math.floor(Math.random()*90);

coinsVal += reward;
coins.innerText = coinsVal;

alert("+" + reward + " coins earned!");

}).catch(()=>{

show_10892289('pop');

});

}

/* COPY */
function copyRef(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

/* WITHDRAW */
function withdraw(){
alert("Sent");
}

</script>

</body>
   </html>
