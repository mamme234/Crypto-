<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Pro Collab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;font-family:Arial;background:#020617;color:white;padding-bottom:80px}
.hidden{display:none}

/* HEADER */
.header{padding:20px;background:#0f172a;display:flex;gap:10px}
.avatar{width:50px;height:50px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-weight:bold}

/* CARD */
.card{margin:15px;background:#111827;padding:20px;border-radius:15px}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;font-weight:bold}
.watch{background:#22c55e;color:white}
.danger{background:#dc2626;color:white}

/* ADMIN */
.adminBox{background:#0f172a;padding:10px;border-radius:10px;margin:10px}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="avatar" id="avatar">U</div>
<div>
<div id="name">User</div>
<div id="username">@user</div>
</div>
</div>

<!-- USER MODE -->
<div id="userPanel">

<div class="card">
<h2>$<span id="balance">0.00</span></h2>

<button class="watch" onclick="watchAd()">Watch Ad</button>
<button onclick="withdraw()">Withdraw</button>
<button onclick="toggleAdmin()">Admin Login</button>
</div>

</div>

<!-- ADMIN MODE -->
<div id="adminPanel" class="hidden">

<div class="card">
<h2>Admin Panel</h2>
<button class="danger" onclick="logoutAdmin()">Logout</button>
</div>

<div class="card">
<h3>Withdraw Requests</h3>
<div id="withdrawList"></div>
</div>

</div>

<script>

const BACKEND="https://crypto-4bbj.onrender.com";

let userId="guest";
let balance=0;
let isAdmin=false;

function safe(n){return isNaN(Number(n))?0:Number(n);}

// telegram
if(window.Telegram){
  Telegram.WebApp.ready();
  const u=Telegram.WebApp.initDataUnsafe.user;
  if(u){
    userId=String(u.id);
    document.getElementById("name").innerText=u.first_name;
    document.getElementById("username").innerText="@"+(u.username||userId);
    document.getElementById("avatar").innerText=(u.first_name||"U")[0];
  }
}

// ================= LOAD USER =================
async function load(){
  const r=await fetch(`${BACKEND}/profile/${userId}`);
  const d=await r.json();

  balance=safe(d.balance);
  document.getElementById("balance").innerText=balance.toFixed(2);
}
load();

// ================= ADS =================
async function watchAd(){
  await show_10892289();

  const r=await fetch(`${BACKEND}/ads`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId})
  });

  const d=await r.json();

  balance=safe(d.balance);
  document.getElementById("balance").innerText=balance.toFixed(2);
}

// ================= WITHDRAW =================
async function withdraw(){
  const wallet=prompt("Wallet");
  const amount=prompt("Amount");

  await fetch(`${BACKEND}/withdraw`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId,wallet,amount:Number(amount)})
  });

  alert("Sent to admin");
}

// ================= ADMIN LOGIN (SIMPLE LOCAL SWITCH) =================
function toggleAdmin(){
  const key=prompt("Enter Admin Key");

  if(key==="admin123"){
    isAdmin=true;
    document.getElementById("userPanel").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    loadWithdraws();
  }else{
    alert("Wrong key");
  }
}

function logoutAdmin(){
  isAdmin=false;
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("userPanel").classList.remove("hidden");
}

// ================= ADMIN LOAD =================
async function loadWithdraws(){
  const r=await fetch(`${BACKEND}/admin/withdraws`,{
    headers:{key:"YOUR_ADMIN_KEY"}
  });

  const data=await r.json();

  let html="";

  data.forEach(w=>{
    html+=`
    <div class="adminBox">
      <div>User: ${w.userId}</div>
      <div>Amount: ${w.amount}</div>
      <div>Status: ${w.status}</div>

      <button onclick="approve('${w._id}')">Approve</button>
      <button onclick="reject('${w._id}')">Reject</button>
    </div>`;
  });

  document.getElementById("withdrawList").innerHTML=html;
}

// ================= APPROVE =================
async function approve(id){
  await fetch(`${BACKEND}/admin/approve`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      key:"YOUR_ADMIN_KEY"
    },
    body:JSON.stringify({id})
  });

  loadWithdraws();
}

// ================= REJECT =================
async function reject(id){
  await fetch(`${BACKEND}/admin/reject`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      key:"YOUR_ADMIN_KEY"
    },
    body:JSON.stringify({id})
  });

  loadWithdraws();
}

</script>

</body>
</html>
