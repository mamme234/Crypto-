<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

/* TAP DESIGN RESTORED */
.tap{
width:260px;
height:260px;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8),0 0 80px rgba(255,150,0,0.5);
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{filter:brightness(1);}
to{filter:brightness(1.4);}
}

/* LEVEL BAR RESTORED */
.level-box{
margin:10px;
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.05);
}

.progress{
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:linear-gradient(90deg,#ff9800,#ffd54f);
width:10%;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="level-box">
<h3>Next Level</h3>
<div class="progress">
<div class="progress-fill" id="progressBar"></div>
</div>
</div>

<!-- TAP -->
<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
</div>

<div style="text-align:center;font-size:12px;color:#aaa">
1 finger = 1 coin | max 4 fingers
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:80px;height:80px;border-radius:50%">
<h3 id="username">User</h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>Social Tasks</h3>
<button onclick="task('telegram')">Join Telegram</button>
<button onclick="task('tiktok')">Follow TikTok</button>
<button onclick="task('youtube')">Subscribe YouTube</button>
</div>

<!-- MONETIZATION SLOT (SAFE) -->
<div class="card">
<h3>Earn More</h3>
<button onclick="openOfferwall()">Watch Ads / Offers</button>
<p style="font-size:12px;color:#aaa">
Opens external reward page (Telegram safe)
</p>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Withdraw Rules</h3>
<p>Minimum withdraw: 20 USDT</p>
<p>Need 10 referrals OR deposit 5 USDT</p>
</div>

<div class="card">
<input id="wAddress" placeholder="Wallet address" style="width:100%;padding:10px;">
<input id="wAmount" placeholder="Amount" style="width:100%;padding:10px;margin-top:10px;">
<button onclick="withdraw()">Submit</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script>

window.onerror=function(){return true;};

let coinsVal=0;

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* SAFE TAP */
document.addEventListener("touchstart",(e)=>{
let f = e.touches ? e.touches.length : 1;
if(f>4) f=4;

coinsVal += f;
document.getElementById("coins").innerText = coinsVal;
});

/* SOCIAL TASK */
function task(type){
let url =
type==="telegram"
?"https://t.me/gangs234"
:type==="tiktok"
?"https://tiktok.com"
:"https://youtube.com";

window.Telegram?.WebApp?.openLink
? window.Telegram.WebApp.openLink(url)
: window.open(url,"_blank");

setTimeout(()=>{
coinsVal += (type==="tiktok"?1000:500);
document.getElementById("coins").innerText = coinsVal;
alert("Task completed");
},4000);
}

/* SAFE MONETIZATION BUTTON */
function openOfferwall(){
window.Telegram?.WebApp?.openLink("https://your-offerwall-link.com")
|| window.open("https://your-offerwall-link.com","_blank");
}

function withdraw(){
alert("Request sent");
}

</script>

</body>
  </html>
