<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Earn App</title>

<script src="https://libtl.com/sdk.js"
data-zone="3304242"
data-sdk="show_3304242"></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b122a,#020617);
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:rgba(255,255,255,0.05);
}

.user{
display:flex;
align-items:center;
gap:10px;
}

.user img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid gold;
}

.small{font-size:12px;opacity:0.7;}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:12px;
text-align:center;
}

.card strong{
font-size:20px;
color:#facc15;
}

/* TAP */
.tap-area{
display:flex;
justify-content:center;
align-items:center;
margin-top:40px;
}

.tap-btn{
width:220px;
height:220px;
border-radius:50%;
background:radial-gradient(circle,#facc15,#f59e0b);
box-shadow:0 0 25px gold;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
user-select:none;
}

.tap-btn:active{
transform:scale(0.95);
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#0f172a;
}

.nav button{
flex:1;
padding:12px;
background:none;
border:none;
color:white;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">

<div class="user">
<img id="photo" src="https://i.imgur.com/8Km9tLL.png">
<div>
<div id="name">Loading...</div>
<div class="small" id="uname">@user</div>
</div>
</div>

<div class="small">
Level: <span id="level">1</span>
</div>

</div>

<!-- STATS -->
<div class="stats">
<div class="card">Coins<br><strong id="coins">0</strong></div>
<div class="card">USDT<br><strong id="usdt">0.000</strong></div>
</div>

<!-- TAP -->
<div class="tap-area">
<div class="tap-btn" id="tapBtn">TAP</div>
</div>

<!-- NAV -->
<div class="nav">
<button>Home</button>
<button>Tasks</button>
<button>Withdraw</button>
<button>Profile</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";

let token=null;
let coins=0;
let usdt=0;
let lastTap=0;

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

/* PROFILE */
if(user){
document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"no_username");

if(user.photo_url){
document.getElementById("photo").src=user.photo_url;
}
}

/* UI UPDATE */
function updateUI(){
document.getElementById("coins").innerText=coins;
document.getElementById("usdt").innerText=usdt.toFixed(3);
}

/* LOGIN */
async function login(){

try{

const res = await fetch(API+"/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user?.id,
name:user?.first_name,
ref:user?.username
})
});

const d = await res.json();
token=d.token;

loadUser();

}catch(e){
setTimeout(login,3000);
}

}

/* LOAD USER */
async function loadUser(){

try{

const res = await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
});

const d = await res.json();

coins = d.coins || 0;
usdt = Number((d.usdt || 0).toFixed(3));

updateUI();

}catch(e){
setTimeout(loadUser,3000);
}

}

/* TAP SYSTEM */
function handleTap(e){

try{

if(!token) return;

let now = Date.now();
let fingers = e.touches ? Math.min(e.touches.length,4) : 1;

/* speed bonus */
let bonus = 1;

if(now - lastTap < 200) bonus = 1.2;
else if(now - lastTap < 400) bonus = 1.1;

lastTap = now;

/* UPDATE */
coins += fingers * bonus;
usdt = coins / 1000;

/* FORMAT */
usdt = Number(usdt.toFixed(3));

updateUI();

/* OPTIONAL BACKEND SYNC */
fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
}).catch(()=>{});

}catch(e){
console.log("tap error");
}

}

/* EVENTS */
tapBtn.addEventListener("touchstart",handleTap);
tapBtn.addEventListener("click",handleTap);

/* START */
login();

</script>

</body>
</html>
