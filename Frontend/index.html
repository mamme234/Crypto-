<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap Earn App</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
margin:10px;
border-radius:16px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

/* 🔥 TAP BUTTON */
.tap{
width:260px;
height:260px;
border-radius:50%;
margin:30px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
box-shadow:0 0 40px rgba(255,152,0,0.7);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
cursor:pointer;
position:relative;
}

/* 💥 PULSE ANIMATION */
.tap.active{
animation:pulse 0.25s ease;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(0.9);}
100%{transform:scale(1);}
}

/* ✨ COIN POP */
.coin-pop{
position:absolute;
color:#ff9800;
font-weight:bold;
font-size:18px;
animation:pop 0.6s forwards;
pointer-events:none;
}

@keyframes pop{
0%{opacity:1;transform:translateY(0);}
100%{opacity:0;transform:translateY(-60px);}
}

.small{
text-align:center;
color:#aaa;
font-size:13px;
margin-top:-10px;
}

/* wallet */
.wallet-box{
background:linear-gradient(135deg,#00c6ff,#0072ff);
padding:15px;
border-radius:14px;
text-align:center;
word-break:break-all;
font-size:13px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
background:#229ED9;
color:white;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{flex:1;border-radius:0;}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">TAP</div>
<div class="small">Maximum tap: 4 fingers</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">
<div class="card" style="text-align:center">
<h3 id="name"></h3>
</div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">
<div class="card">
<h3>💸 Deposit Wallet</h3>
<div class="wallet-box" id="wallet"></div>
</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0, usdtVal=0, refsVal=0;

// screen
function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

// telegram
const tg=window.Telegram.WebApp;
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

// load
async function load(){
const u=await fetch(API+"/api/user",{headers:{Authorization:"Bearer "+token}}).then(r=>r.json());

coinsVal=u.coins;
usdtVal=u.usdt;
refsVal=u.referrals;

updateUI();
name.innerText=u.name;

const w=await fetch(API+"/api/wallet").then(r=>r.json());
wallet.innerText=w.ton;
}

function updateUI(){
coins.innerText=coinsVal;
usdt.innerText=usdtVal;
refs.innerText=refsVal;
level.innerText=Math.floor((coinsVal+usdtVal*1000)/1000)+1;
}

// vibration
function vibrate(){
if(navigator.vibrate) navigator.vibrate(30);
}

// coin animation
function showCoin(x,y,val){
const c=document.createElement("div");
c.className="coin-pop";
c.innerText="+"+val;
c.style.left=x+"px";
c.style.top=y+"px";
document.body.appendChild(c);
setTimeout(()=>c.remove(),600);
}

// TAP SYSTEM
let tapping=false;

const tapArea=document.getElementById("tapArea");

tapArea.addEventListener("touchstart", handleTap);

async function handleTap(e){

if(tapping) return;
tapping=true;

let fingers=e.touches.length;
if(fingers>4) fingers=4;

// 💥 pulse animation
tapArea.classList.add("active");
setTimeout(()=>tapArea.classList.remove("active"),200);

// vibration
vibrate();

// coin pop
showCoin(e.touches[0].clientX,e.touches[0].clientY,fingers);

try{
const res=await fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});

const data=await res.json();

coinsVal=data.coins;
usdtVal=data.usdt;

updateUI();

}catch{}

setTimeout(()=>tapping=false,80);
}

load();

</script>

</body>
  </html>
