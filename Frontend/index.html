<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(180deg,#0b1220,#020617);
  color:#fff;
}

/* SCREENS */
.screen{display:none;padding:15px;}
.active{display:block;}

.card{
  background:rgba(255,255,255,0.06);
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}

/* TAP */
.tap{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:25px auto;
  background:radial-gradient(circle,#ff9800,#ff5722);
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  position:relative;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  background:linear-gradient(90deg,#ff9800,#ff5722);
  color:#fff;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#020617;
  padding:10px;
}

/* FLOAT ANIMATION */
.floating{
  position:absolute;
  color:#fff;
  font-weight:bold;
  animation:up 1s linear forwards;
}

@keyframes up{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-80px);opacity:0;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="screen active">
  <div class="card">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="show('register')">Create Account</button>
  </div>
</div>

<!-- REGISTER -->
<div id="register" class="screen">
  <div class="card">
    <h2>Register</h2>
    <input id="remail" placeholder="Email">
    <input id="rpassword" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <button onclick="show('login')">Back</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">

  <div class="card">
    <h3>Coins: <span id="coins">0</span></h3>
    <h3>USDT: <span id="usdt">0</span></h3>
    <h3>Refs: <span id="refs">0</span></h3>
    <h3>Deposit: <span id="dep">NO</span></h3>
  </div>

  <div class="tap" onclick="tap()">
    🪙 TAP
  </div>

  <button onclick="copyRef()">Copy Referral Link</button>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

  <div class="card">
    <h3>Tasks</h3>
    <div id="tasks"></div>
  </div>

  <div class="card">
    <h3>Leaderboard</h3>
    <div id="board"></div>
  </div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

  <div class="card">
    <h3>Withdraw</h3>
    <p id="status"></p>
  </div>

  <button onclick="withdraw()">Withdraw</button>
  <button onclick="deposit()">Deposit $5 Unlock</button>

</div>

<!-- NAV -->
<div class="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('profile')">Profile</button>
  <button onclick="show('withdraw')">Withdraw</button>
</div>

<script>

const API="https://YOUR-BACKEND.onrender.com";
let token=localStorage.getItem("token");

let coins=0, usdt=0, refs=0, deposit=false;

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* API */
async function api(url,method="GET",body){

  if(!token){
    alert("Login first");
    show("login");
    return;
  }

  const res=await fetch(API+url,{
    method,
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+token
    },
    body:body?JSON.stringify(body):null
  });

  return res.json();
}

/* LOGIN */
async function login(){
  const res=await fetch(API+"/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      email:email.value,
      password:password.value
    })
  });

  const data=await res.json();

  if(data.token){
    token=data.token;
    localStorage.setItem("token",token);
    show("home");
    load();
  }
}

/* REGISTER */
async function register(){
  const res=await fetch(API+"/api/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      email:remail.value,
      password:rpassword.value
    })
  });

  const data=await res.json();

  if(data.token){
    token=data.token;
    localStorage.setItem("token",token);
    show("home");
    load();
  }
}

/* TAP + ANIMATION */
async function tap(){

  const res=await api("/api/tap","POST");
  if(!res) return;

  load();

  const coin=document.createElement("div");
  coin.className="floating";
  coin.innerText="+50 🪙";

  const t=document.querySelector(".tap");
  coin.style.left="60px";
  coin.style.top="60px";

  t.appendChild(coin);

  setTimeout(()=>coin.remove(),1000);
}

/* COPY REF */
function copyRef(){
  const link = API+"/register?ref="+token;
  navigator.clipboard.writeText(link);
  alert("Referral copied!");
}

/* WITHDRAW */
async function withdraw(){
  const address=prompt("Address");
  const amount=prompt("Amount");

  const res=await api("/api/withdraw","POST",{address,amount});
  alert(res.message);
}

/* DEPOSIT */
async function deposit(){
  const res=await api("/api/deposit","POST");
  alert("Deposit request sent");
}

/* LOAD */
async function load(){

  const u=await api("/api/user");
  if(!u) return;

  coins=u.coins;
  usdt=u.usdt;
  refs=u.referrals;
  deposit=u.depositVerified;

  document.getElementById("coins").innerText=coins;
  document.getElementById("usdt").innerText=usdt;
  document.getElementById("refs").innerText=refs;
  document.getElementById("dep").innerText=deposit?"YES":"NO";

  const tasks=await fetch(API+"/api/tasks").then(r=>r.json());

  document.getElementById("tasks").innerHTML=
    tasks.map(t=>`
      <div>${t.title}<button onclick="task('${t._id}')">+${t.reward}</button></div>
    `).join("");

  const board=await fetch(API+"/api/leaderboard").then(r=>r.json());

  document.getElementById("board").innerHTML=
    board.map((u,i)=>`
      <div>#${i+1} ${u.email} ⭐ ${u.coins}</div>
    `).join("");

  document.getElementById("status").innerText=
    (refs>=10 || deposit)
    ? "Ready to withdraw"
    : "Need 10 refs OR $5 deposit";
}

/* TASK */
async function task(id){
  await api("/api/task","POST",{taskId:id});
  load();
}

load();

</script>

</body>
                                                  </html>
