<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tap Earn App</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
margin:10px;
border-radius:16px;
backdrop-filter: blur(10px);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

.tap{
width:260px;
height:260px;
border-radius:50%;
margin:30px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
box-shadow:0 0 40px rgba(255,152,0,0.7);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
cursor:pointer;
transition:0.1s;
position:relative;
}

.tap:active{
transform:scale(0.92);
}

.small{
text-align:center;
color:#aaa;
font-size:13px;
margin-top:-10px;
}

/* coin animation */
.coin-pop{
position:absolute;
color:#ff9800;
font-weight:bold;
animation:pop 0.6s forwards;
pointer-events:none;
}

@keyframes pop{
0%{opacity:1;transform:translateY(0);}
100%{opacity:0;transform:translateY(-50px);}
}

/* wallet UI */
.wallet-box{
background:linear-gradient(135deg,#00c6ff,#0072ff);
padding:15px;
border-radius:14px;
text-align:center;
word-break:break-all;
font-size:13px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
background:#229ED9;
color:white;
font-weight:bold;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{flex:1;border-radius:0;}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">TAP</div>
<div class="small">Maximum tap: 4 fingers</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:80px;height:80px;border-radius:50%">
<h3 id="name"></h3>
</div>

<div class="card">
<h3>🔗 Referral Link</h3>
<p id="refLink"></p>
<button onclick="copyLink()">Copy</button>
</div>

<div class="card">
<h3>🎯 Social Tasks</h3>
<button onclick="task('telegram')">Telegram (+500)</button>
<button onclick="task('tiktok')">TikTok (+700)</button>
<button onclick="task('youtube')">YouTube (+1000)</button>
</div>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board"></div>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>💸 Deposit Wallet</h3>
<div class="wallet-box" id="wallet"></div>
<button onclick="copyWallet()">Copy</button>
</div>

<div class="card">
<button onclick="unlock()">Unlock (5 USDT)</button>
<button onclick="withdraw()">Withdraw</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0, usdtVal=0, refsVal=0;

// screen switch
function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

// telegram login
const tg=window.Telegram.WebApp;
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

// load user
async function load(){
const u=await fetch(API+"/api/user",{headers:{Authorization:"Bearer "+token}}).then(r=>r.json());

coinsVal=u.coins;
usdtVal=u.usdt;
refsVal=u.referrals;

updateUI();

name.innerText=u.name;
refLink.innerText=`👤 ${u.name}\nhttps://t.me/Studybuddy_2025Bot?start=${tg.initDataUnsafe.user.id}`;

const w=await fetch(API+"/api/wallet").then(r=>r.json());
wallet.innerText=w.ton;

const lb=await fetch(API+"/api/leaderboard").then(r=>r.json());
board.innerHTML=lb.map(x=>`<div>${x.name} - ${x.coins}</div>`).join("");

if(u.photo) photo.src=u.photo;
}

function updateUI(){
coins.innerText=coinsVal;
usdt.innerText=Number(usdtVal).toFixed(3);
refs.innerText=refsVal;
level.innerText=Math.floor((coinsVal+usdtVal*1000)/1000)+1;
}

// vibration
function vibrate(){
if(navigator.vibrate) navigator.vibrate(30);
}

// coin animation
function showCoin(x,y,val){
const c=document.createElement("div");
c.className="coin-pop";
c.innerText="+"+val;
c.style.left=x+"px";
c.style.top=y+"px";
document.body.appendChild(c);
setTimeout(()=>c.remove(),600);
}

// REAL TAP
let tapping=false;

document.getElementById("tapArea").addEventListener("touchstart", async function(e){

if(tapping) return;
tapping=true;

let fingers = e.touches.length;
if(fingers > 4) fingers = 4;

vibrate();

showCoin(e.touches[0].clientX,e.touches[0].clientY,fingers);

try{
const res = await fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});

const data = await res.json();

coinsVal=data.coins;
usdtVal=data.usdt;

updateUI();

}catch{}

tapping=false;

});

// tasks
async function task(type){

let url =
type==="telegram"
? "https://t.me/gangs234"
: type==="tiktok"
? "https://tiktok.com/@mammeliyas"
: "https://youtube.com/@Mamme234";

window.open(url,"_blank");

const r = await fetch(API+"/api/task",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({type})
});

alert((await r.json()).message);
load();
}

// copy
function copyLink(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

function copyWallet(){
navigator.clipboard.writeText(wallet.innerText);
alert("Wallet copied");
}

// withdraw
async function unlock(){
alert((await fetch(API+"/api/unlock",{method:"POST",headers:{Authorization:"Bearer "+token}}).then(r=>r.json())).message);
load();
}

async function withdraw(){
const a=prompt("Address");
const b=prompt("Amount");

alert((await fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({address:a,amount:b})
}).then(r=>r.json())).message);

load();
}

load();

</script>

</body>
  </html>
