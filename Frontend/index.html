<!DOCTYPE html>
<html>
<head>
<title>Crypto App</title>
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
.screen{display:none;padding:15px}
.active{display:block}
.card{background:#111827;padding:15px;margin:10px;border-radius:10px}
button{width:100%;padding:10px;margin-top:10px}
.nav{position:fixed;bottom:0;width:100%;display:flex}
.nav button{flex:1}
</style>
</head>

<body>

<div id="home" class="screen active">
<h2>Home</h2>
<p>Coins: <span id="c">0</span></p>
<button onclick="tap()">Tap</button>
</div>

<div id="profile" class="screen">
<h2>Profile</h2>
<button onclick="task()">Task +500</button>
</div>

<div id="withdraw" class="screen">
<h2>Withdraw</h2>
<input id="addr" placeholder="address">
<input id="amt" placeholder="amount">
<button onclick="withdraw()">Send</button>
</div>

<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script>
const API="";
let token=localStorage.getItem("token");

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

async function tap(){
await fetch(API+"/api/tap",{method:"POST",headers:{Authorization:"Bearer "+token}});
load();
}

async function task(){
await fetch(API+"/api/task",{method:"POST",headers:{Authorization:"Bearer "+token}});
load();
}

async function withdraw(){
await fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({amount:amt.value,address:addr.value})
});
}

async function load(){
const r=await fetch(API+"/api/user",{headers:{Authorization:"Bearer "+token}});
const d=await r.json();
document.getElementById("c").innerText=d.coins;
}

load();
</script>

</body>
</html>
