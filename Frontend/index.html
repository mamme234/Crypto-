<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<!-- MONETAG SDK (DO NOT CHANGE) -->
<script src='//libtl.com/sdk.js' data-zone='10892289' data-sdk='show_10892289'></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

/* TAP DESIGN */
.tap{
width:260px;
height:260px;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8);
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
</div>

<!-- ADS BUTTON (IMPORTANT FOR STATS) -->
<div class="card" style="text-align:center">
<h3>💰 Earn More</h3>
<button onclick="watchAd()" style="
padding:12px;
background:orange;
border:none;
color:#fff;
border-radius:10px;
font-weight:bold;">
Watch Ad
</button>
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:80px;height:80px;border-radius:50%">
<h3 id="username">User</h3>
<p id="userid"></p>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Withdraw Rules</h3>
<p>Minimum withdraw: 20 USDT</p>
<p>Need 10 referrals OR deposit 5 USDT</p>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script>

window.onerror=function(){return true;};

let coinsVal=0;

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* TAP SYSTEM */
document.addEventListener("touchstart",(e)=>{
let f = e.touches ? e.touches.length : 1;
if(f>4) f=4;

coinsVal += f;
document.getElementById("coins").innerText = coinsVal;
});

/* 🔥 MONETAG REWARDED AD (FIXED) */
function watchAd(){

try {

if(typeof show_10892289 === "function"){

show_10892289().then(()=>{

// REWARD USER AFTER AD
coinsVal += 100;
document.getElementById("coins").innerText = coinsVal;

alert("You earned 100 coins!");

}).catch(()=>{
alert("Ad not completed");
});

} else {
alert("Ads not loaded yet");
}

} catch(e){
console.log("ad error", e);
}

}

</script>

</body>
                                     </html>
