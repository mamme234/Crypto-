<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Earn App Stable</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b122a;
color:white;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
padding:12px;
background:rgba(255,255,255,0.05);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid gold;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:10px;
text-align:center;
}

.card strong{
display:block;
font-size:20px;
color:#facc15;
}

/* TAP */
.tap{
display:flex;
justify-content:center;
margin-top:30px;
}

.tap button{
width:200px;
height:200px;
border-radius:50%;
background:gold;
font-size:20px;
border:none;
}

/* SCREENS */
.screen{display:none;}
.active{display:block;}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111;
}

.nav button{
flex:1;
padding:10px;
background:none;
border:none;
color:white;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div class="user">
<img id="photo" src="">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Level <span id="level">1</span></div>
</div>

<div class="stats">
<div class="card">Coins<strong id="coins">0</strong></div>
<div class="card">USDT<strong id="usdt">0.000</strong></div>
</div>

<div class="tap">
<button id="tapBtn">TAP</button>
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">
<h3>Profile Screen</h3>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">
<h3>Withdraw Screen</h3>
</div>

<!-- ADS -->
<div id="ads" class="screen">
<h3>Ads Screen</h3>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('ads')">Ads</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";

/* SAFE VARIABLES (IMPORTANT FIX) */
let coins = 0;
let usdt = 0;
let token = null;
let lastTap = 0;

/* ELEMENTS (FIX "NOT DEFINED") */
const coinsEl = document.getElementById("coins");
const usdtEl = document.getElementById("usdt");
const tapBtn = document.getElementById("tapBtn");

/* SCREEN NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* UPDATE UI */
function update(){
coinsEl.innerText = Math.floor(coins);
usdtEl.innerText = usdt.toFixed(3);
}

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

if(user){
document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"no_user");
if(user.photo_url) document.getElementById("photo").src=user.photo_url;
}

/* TAP FIX (NO CRASH) */
tapBtn.addEventListener("click",tapHandler);
tapBtn.addEventListener("touchstart",tapHandler);

function tapHandler(e){

e.preventDefault();

let now = Date.now();
let fingers = e.touches ? Math.min(e.touches.length,4) : 1;

let bonus = 1;
if(now - lastTap < 200) bonus = 1.2;

lastTap = now;

/* SAFE CALC */
coins += fingers * bonus;
usdt = coins / 1000;

update();

/* OPTIONAL BACKEND (SAFE) */
if(token){
fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
}).catch(()=>{});
}

}

/* LOGIN SAFE */
async function login(){

try{

const res = await fetch(API+"/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user?.id,
name:user?.first_name,
ref:user?.username
})
});

const d = await res.json();
token = d.token;

}catch(e){
setTimeout(login,3000);
}

}

login();

</script>

</body>
</html>
