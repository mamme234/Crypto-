<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Earn App Full</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b122a;
color:white;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
padding:12px;
background:rgba(255,255,255,0.05);
}

.user{
display:flex;
align-items:center;
gap:10px;
}

.user img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid gold;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.card{
background:rgba(255,255,255,0.05);
padding:12px;
border-radius:10px;
text-align:center;
}

.card strong{
display:block;
font-size:20px;
color:#facc15;
}

/* TAP */
.tap{
display:flex;
justify-content:center;
margin-top:30px;
}

.tap button{
width:180px;
height:180px;
border-radius:50%;
background:gold;
border:none;
font-size:20px;
}

/* SCREEN */
.screen{display:none;}
.active{display:block;padding:10px;}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111;
}

.nav button{
flex:1;
padding:10px;
background:none;
border:none;
color:white;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div class="user">
<img id="photo">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Lv <span id="level">1</span></div>
</div>

<div class="stats">
<div class="card">Coins<strong id="coins">0</strong></div>
<div class="card">USDT<strong id="usdt">0.000</strong></div>
</div>

<div class="tap">
<button id="tapBtn">TAP</button>
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<h2>Profile</h2>

<p id="pName"></p>
<p id="pUser"></p>

<div class="card">
Referral Link:
<p id="ref"></p>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<h2>Withdraw</h2>

<div class="card">
<p>Min: 20 USDT</p>
<p>Need 10 referrals or deposit 5 USDT</p>
</div>

<input placeholder="Wallet address" style="width:100%;padding:10px;">
<br><br>
<input placeholder="Amount USDT" style="width:100%;padding:10px;">

<br><br>
<button style="width:100%;padding:10px;">Withdraw</button>

</div>

<!-- ADS -->
<div id="ads" class="screen">

<h2>Ads</h2>

<div class="card">
<button onclick="alert('Ad clicked')">Watch Ad</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('ads')">Ads</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

let coins = 0;
let usdt = 0;
let lastTap = 0;

const coinsEl = document.getElementById("coins");
const usdtEl = document.getElementById("usdt");
const tapBtn = document.getElementById("tapBtn");

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

if(user){

document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"user");

document.getElementById("pName").innerText="Name: "+user.first_name;
document.getElementById("pUser").innerText="ID: "+user.id;

document.getElementById("ref").innerText=
"https://t.me/YourBot?start="+user.id;

if(user.photo_url)
document.getElementById("photo").src=user.photo_url;

}

/* UPDATE */
function update(){
coinsEl.innerText = Math.floor(coins);
usdtEl.innerText = usdt.toFixed(3);
}

/* TAP */
tapBtn.addEventListener("click",tap);
tapBtn.addEventListener("touchstart",tap);

function tap(e){

let now = Date.now();
let fingers = e.touches ? Math.min(e.touches.length,4) : 1;

let bonus = 1;
if(now - lastTap < 200) bonus = 1.2;

lastTap = now;

coins += fingers * bonus;
usdt = coins / 1000;

update();
}

</script>

</body>
  </html>
