<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<script src="https://libtl.com/sdk.js"
data-zone="3304242"
data-sdk="show_3304242"></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{text-align:center;}
.stat strong{display:block;font-size:22px;color:#ff9800;}

.level-box{margin:10px;padding:10px;border-radius:15px;background:rgba(255,255,255,0.05);}
.progress{height:10px;background:#222;border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#ff9800,#ffd54f);width:10%;}

.tap{
width:260px;height:260px;
display:flex;align-items:center;justify-content:center;
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
}

.tap img{
width:230px;height:230px;border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8);
}

.task-btn{
background:#229ED9;
padding:12px;border:none;border-radius:10px;
margin-top:10px;color:#fff;font-weight:bold;width:100%;
}

.copy-btn{
background:#ff9800;
padding:12px;border:none;border-radius:10px;
color:#fff;margin-top:10px;width:100%;
}

.nav{
position:fixed;bottom:0;width:100%;
display:flex;background:#020617;
}

.nav button{flex:1;padding:12px;border:none;background:#111;color:#fff;}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">
<div class="card" style="text-align:center">
<img id="photo" style="width:90px;height:90px;border-radius:50%;border:3px solid #ff9800;">
<h3 id="username"></h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>Referral</h3>
<p id="refLink"></p>
<button class="copy-btn" onclick="copyRef()">Copy</button>
</div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">
<div class="card">
<h3>Withdraw</h3>
<input id="wAddress" placeholder="wallet">
<input id="wAmount" placeholder="amount">
<button class="copy-btn" onclick="withdraw()">Send</button>
</div>
</div>

<!-- ADS -->
<div id="ads" class="screen">
<div class="card">
<h3>Ads Reward</h3>
<button class="task-btn" onclick="watchAd()">Watch Ad</button>
</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('ads')">Ads</button>
</div>

<script>
const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0, usdtVal=0, refsVal=0;

/* SCREEN */
function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* FIX STATS */
function updateStats(){
usdtVal = Math.floor(coinsVal / 1000);
coins.innerText = coinsVal;
usdt.innerText = usdtVal;
level.innerText = Math.floor(coinsVal / 1000) + 1;
}

/* LOAD */
async function load(){
const u = await fetch(API+"/api/user",{headers:{Authorization:"Bearer "+token}}).then(r=>r.json());

coinsVal = u.coins || 0;
refsVal = u.referrals || 0;

updateStats();
refs.innerText = refsVal;
}

/* FIX TAP (NO DOUBLE BUG) */
let lastTap = 0;

tapArea.addEventListener("touchstart",(e)=>{

const now = Date.now();
if(now - lastTap < 120) return;
lastTap = now;

let fingers = Math.min(e.touches?.length || 1,4);

coinsVal += fingers;
updateStats();

fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});

});

/* PROFILE */
const tg = window.Telegram?.WebApp;
if(tg) tg.expand();

const user = tg?.initDataUnsafe?.user;

if(user){
username.innerText = user.first_name;
userid.innerText = "ID:"+user.id;

let uname = user.username || user.first_name;
refLink.innerText = "https://t.me/YourBot?start="+uname;

if(user.photo_url) photo.src=user.photo_url;
}

/* WITHDRAW */
function withdraw(){
fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
address:wAddress.value,
amount:wAmount.value
})
});
}

/* ADS FIX */
function watchAd(){

if(typeof show_3304242 !== "function"){
alert("No ads available");
return;
}

show_3304242().then(()=>{

coinsVal += 300;
updateStats();

alert("Reward added");

});

}

load();
</script>

</body>
</html>
