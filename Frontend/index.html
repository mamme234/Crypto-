<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<style>
/* KEEP YOUR ORIGINAL CSS (unchanged) */
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

.tap{
width:260px;
height:260px;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8);
}

.tap:active img{transform:scale(0.92);}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/512px-Bitcoin.svg.png">
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">
<div class="card" style="text-align:center">
<h3 id="username"></h3>
<p id="userid"></p>
</div>

<div class="card">
<p id="refLink"></p>
<button onclick="copyRef()">Copy Link</button>
</div>

<div class="card">
<button onclick="task('telegram')">Join Telegram</button>
<button onclick="task('tiktok')">Follow TikTok</button>
<button onclick="task('youtube')">Subscribe YouTube</button>
</div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">
<div class="card">
<p id="wallet"></p>
<button onclick="copyWallet()">Copy Address</button>
</div>
</div>

<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

// ✅ GLOBAL ERROR SAFE (won't break app)
window.onerror = function(){};

// API
const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

// VALUES
let coinsVal=0, usdtVal=0, refsVal=0;

// NAV
function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

// ✅ TELEGRAM SAFE
const tg = window.Telegram?.WebApp;
if(tg) tg.expand();

const user = tg?.initDataUnsafe?.user;

// ✅ LOGIN (RESTORED)
if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

// ✅ LOAD USER (RESTORED)
async function load(){
if(!token) return;

try{
const u=await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
}).then(r=>r.json());

coinsVal=u.coins;
usdtVal=u.usdt;
refsVal=u.referrals;

coins.innerText=coinsVal;
usdt.innerText=usdtVal;
refs.innerText=refsVal;

if(user){
username.innerText=user.first_name;
userid.innerText="ID: "+user.id;
refLink.innerText="https://t.me/Studybuddy_2025Bot?start="+user.id;
}

const w=await fetch(API+"/api/wallet").then(r=>r.json());
wallet.innerText=w.ton;

}catch(e){
console.log("load error",e);
}
}

// ✅ TAP FIX (multi finger works)
let lastTapTime=0;

tapArea.addEventListener("touchstart",(e)=>{
try{
const now=Date.now();
if(now-lastTapTime<100) return;
lastTapTime=now;

let fingers=e.touches.length;
if(fingers>4) fingers=4;

coinsVal+=fingers;
coins.innerText=coinsVal;

if(token){
fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});
}

}catch(e){}
});

// ✅ COPY FUNCTIONS FIXED
function copyRef(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

function copyWallet(){
navigator.clipboard.writeText(wallet.innerText);
alert("Copied");
}

// ✅ TASK FIXED
function task(type){

let url=
type==="telegram"
?"https://t.me/gangs234"
:type==="tiktok"
?"https://tiktok.com/@mammeliyas"
:"https://youtube.com/@Mamme234";

window.open(url,"_blank");

setTimeout(()=>{
coinsVal+=100;
coins.innerText=coinsVal;
},3000);
}

// INIT
load();

</script>

</body>
</html>
