src="//libtl.com/sdk.js"

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:linear-gradient(to bottom,#0f172a,#020617);
color:white;
min-height:100vh;
}

.topbar{
background:#111827;
padding:15px;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid #1e293b;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
background:#22c55e;
display:flex;
align-items:center;
justify-content:center;

font-weight:bold;
}

.userinfo{
display:flex;
flex-direction:column;
}

.name{
font-size:18px;
font-weight:bold;
}

.uid{
font-size:13px;
color:#94a3b8;
margin-top:2px;
}

.profileCard{
background:#1e293b;
margin:20px;
padding:20px;
border-radius:24px;
}

.profileTop{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.profileAvatar{
width:70px;
height:70px;
border-radius:50%;
background:#22c55e;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
}

.profileStats{
display:flex;
gap:10px;
}

.pbox{
flex:1;
background:#0f172a;
padding:15px;
border-radius:18px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
border-radius:24px;
padding:25px;
text-align:center;
}

.balance{
font-size:46px;
font-weight:bold;
color:#22c55e;
margin:20px 0;
}

.watch{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(45deg,#22c55e,#16a34a);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.withdrawBtn{
background:linear-gradient(45deg,#3b82f6,#2563eb);
}

.info{
margin-top:15px;
font-size:14px;
color:#94a3b8;
}

.progress{
margin-top:15px;
background:#0f172a;
border-radius:20px;
overflow:hidden;
height:16px;
}

.progressBar{
height:100%;
width:0%;
background:#22c55e;
}

.rules{
margin-top:20px;
text-align:left;
font-size:14px;
line-height:1.8;
color:#cbd5e1;
}

</style>

</head>

<body>

<!-- TOP -->

<div class="topbar">

<div class="avatar" id="avatar">
U
</div>

<div class="userinfo">

<div class="name" id="tgname">
Telegram User
</div>

<div class="uid">
ID:
<span id="uid"></span>
</div>

</div>

</div>

<!-- PROFILE -->

<div class="profileCard">

<div class="profileTop">

<div class="profileAvatar"
id="profileAvatar">
U
</div>

<div>

<h2 id="profileName">
Telegram User
</h2>

<p id="profileUsername">
@username
</p>

</div>

</div>

<div class="profileStats">

<div class="pbox">
<h3 id="profileBalance">
0.00
</h3>
<p>USDT</p>
</div>

<div class="pbox">
<h3 id="profileRefs">
0
</h3>
<p>Refs</p>
</div>

<div class="pbox">
<h3 id="profileAds">
0
</h3>
<p>Ads</p>
</div>

</div>

</div>

<!-- MAIN -->

<div class="container">

<div class="card">

<h2>
Your Balance
</h2>

<div class="balance">
$<span id="usdt">0.00</span>
</div>

<button
class="watch"
id="watchBtn"
onclick="watchAd()">

Watch Ad & Earn

</button>

<button
class="watch withdrawBtn"
onclick="withdrawNow()">

Withdraw

</button>

<div class="info">
Earn 0.03 USDT per ad
</div>

<div class="progress">

<div class="progressBar"
id="progressBar">
</div>

</div>

<div class="info"
id="progressText">

0 / 500 Ads Completed

</div>

<div class="rules">

✅ Withdraw Rules

<br><br>

• Minimum withdraw:
5 USDT

<br>

• Need:
10 referrals

<br>

• Watch:
500 ads minimum

</div>

</div>

</div>

<script>

/* ================= CONFIG ================= */

const BACKEND =
"https://crypto-4bbj.onrender.com";

const SECRET_KEY =
"META_9xK2_secure_2026";

/* ================= USER ================= */

let userId = "guest";

let tgName = "Telegram User";

let firstName = "User";

let avatarLetter = "U";

/* ================= TELEGRAM ================= */

if(window.Telegram && Telegram.WebApp){

Telegram.WebApp.ready();

const tgUser =
Telegram.WebApp.initDataUnsafe.user;

if(tgUser){

userId = String(tgUser.id);

tgName = tgUser.username
? "@"+tgUser.username
: "@user"+userId;

firstName =
tgUser.first_name || "User";

avatarLetter =
firstName.charAt(0).toUpperCase();

}

}

/* ================= TOP UI ================= */

document.getElementById("uid").innerText =
userId;

document.getElementById("tgname").innerText =
tgName;

document.getElementById("avatar").innerText =
avatarLetter;

/* ================= LOAD PROFILE ================= */

async function loadProfile(){

try{

const res = await fetch(
`${BACKEND}/profile/${userId}`
);

const data = await res.json();

document.getElementById("usdt").innerText =
Number(data.balance || 0).toFixed(2);

document.getElementById("profileBalance").innerText =
Number(data.balance || 0).toFixed(2);

document.getElementById("profileRefs").innerText =
data.refs || 0;

document.getElementById("profileAds").innerText =
data.adsWatched || 0;

document.getElementById("profileName").innerText =
firstName;

document.getElementById("profileUsername").innerText =
tgName;

document.getElementById("profileAvatar").innerText =
avatarLetter;

/* PROGRESS */

const ads =
data.adsWatched || 0;

const percent =
Math.min(
(ads / 500) * 100,
100
);

document.getElementById("progressBar")
.style.width =
percent + "%";

document.getElementById("progressText")
.innerText =
`${ads} / 500 Ads Completed`;

}catch(err){

console.log(err);

}

}

loadProfile();

/* ================= WATCH AD ================= */

async function watchAd(){

const btn =
document.getElementById("watchBtn");

try{

btn.disabled = true;

btn.innerText =
"Loading Ad...";

/* SDK CHECK */

if(
typeof show_10892289 === "undefined"
){

alert("Ads SDK failed");

btn.disabled = false;

btn.innerText =
"Watch Ad & Earn";

return;

}

/* SHOW AD */

await show_10892289();

/* SAVE REWARD */

const res =
await fetch(
`${BACKEND}/ads`,
{
method:"POST",

headers:{
"Content-Type":"application/json",
"authorization":SECRET_KEY
},

body:JSON.stringify({
userId
})

}
);

const data =
await res.json();

if(data.success){

alert("+0.03 USDT Added!");

loadProfile();

}else{

alert(
data.message ||
"Reward failed"
);

}

}catch(err){

console.log(err);

alert("Ad failed or closed");

}

btn.disabled = false;

btn.innerText =
"Watch Ad & Earn";

}

/* ================= WITHDRAW ================= */

async function withdrawNow(){

const amount =
prompt(
"Enter withdraw amount"
);

if(!amount) return;

try{

const res =
await fetch(
`${BACKEND}/withdraw`,
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

userId,
amount:Number(amount)

})

}
);

const data =
await res.json();

alert(data.message);

if(data.success){

loadProfile();

}

}catch(err){

console.log(err);

alert("Withdraw failed");

}

}

</script>

</body>
  </html>
