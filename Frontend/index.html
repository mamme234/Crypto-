<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clean Tap Game</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b122a;
color:white;
text-align:center;
}

/* TOP */
.top{
display:flex;
justify-content:space-between;
padding:12px;
background:rgba(255,255,255,0.05);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:40px;
height:40px;
border-radius:50%;
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
margin-top:10px;
}

/* TAP */
.tap{
margin-top:80px;
}

.btn{
width:200px;
height:200px;
border-radius:50%;
background:gold;
font-size:22px;
border:none;
}

/* ENERGY */
.energy{
width:80%;
height:10px;
background:#222;
margin:20px auto;
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:100%;
background:lime;
transition:0.2s;
}
</style>
</head>

<body>

<div class="top">
<div class="user">
<img id="photo">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Lv <span id="level">1</span></div>
</div>

<div class="stats">
<div>Coins: <span id="coins">0</span></div>
<div>USDT: <span id="usdt">0.000</span></div>
</div>

<div class="energy">
<div class="fill" id="energyBar"></div>
</div>

<div class="tap">
<button class="btn" id="tapBtn">TAP</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

/* SINGLE SOURCE STATE (IMPORTANT FIX) */
let state = {
coins:0,
energy:100,
lastTap:0
};

const maxEnergy = 100;

/* UI */
function render(){
document.getElementById("coins").innerText = Math.floor(state.coins);
document.getElementById("usdt").innerText = (state.coins/1000).toFixed(3);
document.getElementById("energyBar").style.width = state.energy + "%";
document.getElementById("level").innerText = Math.floor(state.coins/5000)+1;
}

/* ENERGY REGEN */
setInterval(()=>{
if(state.energy < maxEnergy){
state.energy++;
render();
}
},1000);

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

if(user){
document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"user");
if(user.photo_url) document.getElementById("photo").src=user.photo_url;
}

/* TAP (100% FIXED - NO DOUBLE COUNT) */
tapBtn.addEventListener("click",tap);

function tap(){

if(state.energy <= 0) return;

let now = Date.now();

/* anti double click */
if(now - state.lastTap < 120) return;

state.lastTap = now;

/* GAME LOGIC */
state.energy -= 1;
state.coins += 1;

/* UPDATE */
render();
}

render();

</script>

</body>
</html>
