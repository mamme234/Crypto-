<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Tap Pro</title>

<script src="https://wrathful-piano.com/b.3/VH0/PJ3vpMv/btmOVbJDZbDp0/2sO/Tag/4rOCD/AmxiLtTMYQ5/OUD/gf4sM/DlUC"></script>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);
color:white;
}

.topbar{
display:flex;
justify-content:space-between;
padding:14px;
background:rgba(255,255,255,0.06);
}

.stats{
display:flex;
justify-content:space-around;
margin-top:12px;
}

.box{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:14px;
width:40%;
text-align:center;
}

.tap{
display:flex;
justify-content:center;
margin-top:70px;
}

.tap button{
width:220px;
height:220px;
border-radius:50%;
border:none;
font-size:22px;
background:gold;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.6);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
border:none;
}

.profileCard{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:12px;
margin-top:10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div>User</div>
<div>Lv 1</div>
</div>

<div class="stats">
<div class="box">Coins <div id="coins">0</div></div>
<div class="box">USDT <div id="usdt">0.000</div></div>
</div>

<div class="tap">
<button id="tapBtn">TAP</button>
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="profileCard">
<h3>💰 Ads</h3>
<button onclick="watchAd()">Watch Ad</button>
</div>

<div class="profileCard">
<h3>💸 Withdraw</h3>
<input id="wallet" placeholder="Wallet">
<input id="amount" placeholder="Amount">
<button onclick="withdraw()">Withdraw</button>
</div>

</div>

<!-- DEPOSIT -->
<div id="deposit" class="screen">
<div class="profileCard">
<h3>Deposit</h3>
<input readonly value="YOUR_WALLET_ADDRESS">
</div>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('deposit')">Deposit</button>
</div>

<script>
/* =====================
   API
===================== */
const API = "https://crypto-4bbj.onrender.com";
const API_POST = "https://my-channel-1.onrender.com/post";

/* =====================
   STATE (ONLY ONCE)
===================== */
let state = {
  coins: 0,
  usdt: 0,
  referrals: 0
};

let adRunning = false;
let lastAdTime = 0;

/* =====================
   UI
===================== */
function render(){
document.getElementById("coins").innerText = Math.floor(state.coins);
document.getElementById("usdt").innerText = state.usdt.toFixed(3);
}

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* =====================
   TAP
===================== */
let lastTap = 0;

function tap(){
let now = Date.now();
if(now - lastTap < 80) return;
lastTap = now;

state.coins += 1;
state.usdt += 0.001;

render();
}

/* =====================
   ADS (ONLY ONE VERSION)
===================== */
function watchAd(){

if(adRunning) return alert("Ad running...");
if(Date.now() - lastAdTime < 30000) return alert("Wait 30s");

adRunning = true;
lastAdTime = Date.now();

let w = window.open("https://wrathful-piano.com/b.3/VH0/PJ3vpMv/btmOVbJDZbDp0/2sO/Tag/4rOCD/AmxiLtTMYQ5/OUD/gf4sM/DlUC","_blank");

if(!w){
alert("Popup blocked");
adRunning = false;
return;
}

setTimeout(()=>{
state.coins += 50;
state.usdt += 0.005;
render();

sendUpdate("🎁 User watched ad and earned reward");

adRunning = false;
},6000);
}

/* =====================
   WITHDRAW
===================== */
async function withdraw(){

let wallet = document.getElementById("wallet").value;
let amount = document.getElementById("amount").value;

if(amount < 20){
alert("Min 20 USDT");
return;
}

let res = await fetch(API+"/withdraw",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({wallet,amount})
});

let data = await res.json();
alert(data.message || "Sent");
}

/* =====================
   SEND UPDATE
===================== */
async function sendUpdate(message){
try{
await fetch(API_POST,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
});
}catch(e){}
}

/* =====================
   INIT
===================== */
document.getElementById("tapBtn").addEventListener("click",tap);
render();
</script>

</body>
   </html>
