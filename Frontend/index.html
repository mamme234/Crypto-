<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<!-- ✅ MONETAG ADDED ONLY -->
<script src='//libtl.com/sdk.js' data-zone='10892289' data-sdk='show_10892289'></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

/* LEVEL */
.level-box{
margin:10px;
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.05);
}
.progress{
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
}
.progress-fill{
height:100%;
background:linear-gradient(90deg,#ff9800,#ffd54f);
width:10%;
}

/* TAP */
.tap{
width:260px;
height:260px;
margin:0;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8);
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{filter:brightness(1);}
to{filter:brightness(1.4);}
}

.task-btn{
background:linear-gradient(135deg,#229ED9,#0072ff);
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
color:#fff;
font-weight:bold;
width:100%;
}

.copy-btn{
background:linear-gradient(135deg,#ff9800,#ff5722);
padding:12px;
border:none;
border-radius:10px;
color:#fff;
margin-top:10px;
width:100%;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="level-box">
<h3>Level Progress</h3>
<div class="progress">
<div class="progress-fill" id="progressBar"></div>
</div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/512px-Bitcoin.svg.png">
</div>

<!-- OPTIONAL BUTTON (ONLY ADDITION) -->
<button class="task-btn" onclick="watchAdReward()">
💰 Watch Ad & Earn (Monetag)
</button>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:90px;height:90px;border-radius:50%;border:3px solid #ff9800;">
<h3 id="username"></h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>Your Referral</h3>
<p id="refLink"></p>
<button class="copy-btn" onclick="copyRef()">Copy Link</button>
</div>

<div class="card">
<h3>🔥 Social Tasks (STRICT)</h3>

<button class="task-btn" onclick="task('telegram')">
📢 Join Telegram (Verify Required)
</button>

<button class="task-btn" onclick="task('tiktok')">
🎵 Follow TikTok (Verify Required)
</button>

<button class="task-btn" onclick="task('youtube')">
▶ Subscribe YouTube (Verify Required)
</button>

<button class="task-btn" onclick="verifyTask()">
✅ Verify Completion
</button>

</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Withdraw Rules</h3>
<p>• Minimum withdraw: 20 USDT</p>
<p>• Need 10 referrals OR deposit 5 USDT</p>
</div>

<div class="card">
<h3>Deposit Wallet</h3>
<p id="wallet"></p>
<button class="copy-btn" onclick="copyWallet()">Copy Address</button>
</div>

<div class="card">
<h3>Withdraw</h3>

<input id="wAddress" placeholder="Your wallet address"
style="width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;">

<input id="wAmount" placeholder="Amount (USDT)"
style="width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;">

<button class="copy-btn" onclick="withdraw()">Submit Withdraw</button>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0, usdtVal=0, refsVal=0;

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

const user=tg?.initDataUnsafe?.user;

// LOGIN
if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

// LOAD
async function load(){
const u=await fetch(API+"/api/user",{headers:{Authorization:"Bearer "+token}}).then(r=>r.json());

coinsVal=u.coins;
usdtVal=u.usdt;
refsVal=u.referrals;

coins.innerText=coinsVal;
usdt.innerText=usdtVal;
refs.innerText=refsVal;
level.innerText=Math.floor((coinsVal+usdtVal*1000)/1000)+1;

if(user){
username.innerText=user.first_name;
userid.innerText="ID: "+user.id;
refLink.innerText="https://t.me/Studybuddy_2025Bot?start="+user.id;
}

if(u.photo) photo.src=u.photo;

const w=await fetch(API+"/api/wallet").then(r=>r.json());
wallet.innerText=w.ton;
}

// TAP
let lastTapTime=0;

tapArea.addEventListener("touchstart",(e)=>{

const now=Date.now();
if(now-lastTapTime<90) return;
lastTapTime=now;

let fingers = e.touches?.length || 1;
fingers = Math.min(fingers, 4);

coinsVal += fingers;
coins.innerText = coinsVal;

if(token){
fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});
}

});

// TASK
function task(type){

let url=
type==="telegram"
?"https://t.me/gangs234"
:type==="tiktok"
?"https://tiktok.com/@mammeliyas"
:"https://youtube.com/@Mamme234";

window.open(url,"_blank");

fetch(API+"/api/task/start",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({type})
});

alert("Task started. Verify later.");
}

// VERIFY
async function verifyTask(){

const res = await fetch(API+"/api/task/verify",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
}
});

const data = await res.json();

if(data.success){
coinsVal += data.reward;
coins.innerText = coinsVal;
alert("Verified!");
}else{
alert("Not completed");
}

}

// COPY
function copyRef(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

function copyWallet(){
navigator.clipboard.writeText(wallet.innerText);
alert("Copied");
}

// WITHDRAW
function withdraw(){
fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
address:wAddress.value,
amount:wAmount.value
})
});
alert("Request sent");
}

/* =========================
   MONETAG REWARD FUNCTION
   ========================= */

let adMultiplier = 1;
let adTimer = null;

function watchAdReward(){

if(typeof show_10892289 !== "function") return;

show_10892289().then(()=>{

let reward = 310 + Math.floor(Math.random()*90);
reward *= adMultiplier;

coinsVal += reward;
coins.innerText = coinsVal;

alert("+" + reward + " coins");

adMultiplier = 2;

if(adTimer) clearTimeout(adTimer);

adTimer = setTimeout(()=>{
adMultiplier = 1;
},60000);

});

}

load();

</script>

</body>
  </html>
