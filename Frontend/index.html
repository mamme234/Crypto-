<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(180deg,#0b1220,#020617);
  color:#fff;
}

/* HEADER */
.header{
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

/* SCREENS */
.screen{
  display:none;
  padding:15px;
}
.active{display:block;}

/* CARD */
.card{
  background:rgba(255,255,255,0.06);
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{text-align:center;}
.stat strong{display:block;font-size:20px;color:#ff9800;}

/* TAP */
.tap{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:25px auto;
  background:radial-gradient(circle,#ff9800,#ff5722);
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  background:linear-gradient(90deg,#ff9800,#ff5722);
  color:#fff;
}

/* TASK */
.task{
  background:#0f172a;
  padding:10px;
  margin-top:10px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#020617;
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.nav button{
  width:auto;
  background:none;
}

/* LOADER */
.loader{
  display:none;
  text-align:center;
  padding:10px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="header">💰 Crypto</div>

<div class="loader" id="loader">Loading...</div>

<!-- HOME -->
<div id="home" class="screen active">

  <div class="card grid">
    <div class="stat">Coins<strong id="coins">0</strong></div>
    <div class="stat">USDT<strong id="usdt">0</strong></div>
    <div class="stat">Level<strong id="level">1</strong></div>
    <div class="stat">Refs<strong id="refs">0</strong></div>
  </div>

  <div class="tap" onclick="tap()">
    <img src="https://cdn-icons-png.flaticon.com/512/825/825540.png"
         style="width:90px;height:90px;">
  </div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

  <div class="card">
    <h3>📋 Tasks</h3>
    <div id="tasks"></div>
  </div>

  <div class="card">
    <h3>🏆 Leaderboard</h3>
    <div id="board"></div>
  </div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

  <div class="card">
    <h3>💸 Withdraw</h3>
    <p id="status"></p>
  </div>

  <button onclick="withdraw()">Withdraw</button>
  <button onclick="deposit()">Deposit $5 Unlock</button>

</div>

<!-- NAV -->
<div class="nav">
  <button onclick="nav('home')">🏠</button>
  <button onclick="nav('profile')">👤</button>
  <button onclick="nav('withdraw')">💸</button>
</div>

<script>

const API="https://YOUR-BACKEND.onrender.com";
let token=localStorage.getItem("token");

let coins=0, usdt=0, refs=0;

function nav(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showLoad(v){
  document.getElementById("loader").style.display=v?"block":"none";
}

/* SAFE API */
async function api(url,method="GET",body){
  try{

    if(!token){
      alert("Please login first");
      return;
    }

    showLoad(true);

    const res=await fetch(API+url,{
      method,
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:body?JSON.stringify(body):null
    });

    const data=await res.json();

    showLoad(false);
    return data;

  }catch(e){
    showLoad(false);
    alert("Server error");
  }
}

/* LOAD */
async function load(){

  const u=await api("/api/user");
  if(!u) return;

  coins=u.coins;
  usdt=u.usdt;
  refs=u.referrals;

  document.getElementById("coins").innerText=coins;
  document.getElementById("usdt").innerText=usdt;
  document.getElementById("refs").innerText=refs;

  document.getElementById("level").innerText=Math.floor(coins/5000)+1;

  const tasks=await fetch(API+"/api/tasks").then(r=>r.json());

  document.getElementById("tasks").innerHTML=
    tasks.map(t=>`
      <div class="task">
        <span>${t.title}</span>
        <button onclick="doTask('${t._id}')">+${t.reward}</button>
      </div>
    `).join("");

  const board=await fetch(API+"/api/leaderboard").then(r=>r.json());

  document.getElementById("board").innerHTML=
    board.map((u,i)=>`
      <div style="padding:8px;margin:5px;background:#0f172a;border-radius:10px;">
        #${i+1} ${u.email} ⭐ ${u.coins}
      </div>
    `).join("");

  document.getElementById("status").innerText=
    (refs>=10) ? "✅ Ready to withdraw" : "❌ Need 10 referrals";
}

/* ACTIONS */
async function tap(){ await api("/api/tap","POST"); load(); }
async function doTask(id){ await api("/api/task","POST",{taskId:id}); load(); }
async function withdraw(){
  const address=prompt("Address");
  const amount=prompt("Amount");
  const res=await api("/api/withdraw","POST",{address,amount});
  alert(res.message);
}
async function deposit(){
  const res=await api("/api/deposit","POST");
  alert("Request sent");
}

load();

</script>

</body>
      </html>
