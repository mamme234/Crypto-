<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Tap Pro</title>

<!-- ✅ YOUR ADS SCRIPT -->
<script src='//libtl.com/sdk.js' data-zone='10892289' data-sdk='show_10892289'></script>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:48px;
height:48px;
border-radius:50%;
border:2px solid #facc15;
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
margin-top:12px;
}

.box{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:14px;
width:40%;
text-align:center;
}

/* TAP */
.tap{
display:flex;
justify-content:center;
margin-top:70px;
}

.tap button{
width:220px;
height:220px;
border-radius:50%;
border:none;
background:radial-gradient(circle,#ffe066,#facc15);
}

/* SCREEN */
.screen{display:none;padding:15px;}
.active{display:block;}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.6);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
border:none;
}

.profileCard{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:18px;
margin-top:10px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
margin-top:8px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div class="user">
<img id="photo">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Lv <span id="level">1</span></div>
</div>

<div class="stats">
<div class="box">Coins<strong id="coins">0</strong></div>
<div class="box">USDT<strong id="usdt">0.000</strong></div>
</div>

<div class="tap">
<button id="tapBtn"></button>
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="profileCard">
<h3>🔗 Referral</h3>
<input id="refLink" readonly>
<button onclick="copyRef()">Copy</button>
</div>

<div class="profileCard">
<h3>🔥 Tasks</h3>
<button onclick="task('telegram')">Telegram (+500)</button>
<button onclick="task('youtube')">YouTube (+1250)</button>
<button onclick="task('tiktok')">TikTok (+1000)</button>
</div>

<div class="profileCard">
<h3>💰 Ads</h3>
<button onclick="ads()">Watch Ad (+300)</button>
</div>

<div class="profileCard">
<h3>💸 Withdraw</h3>
<input id="wallet" placeholder="Wallet">
<input id="amount" placeholder="Amount">
<button onclick="withdraw()">Withdraw</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API = "https://your-render-url.onrender.com";

let state = {coins:0,usdt:0};

const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

/* LOAD USER */
async function loadUser(){
if(!user) return;

let res = await fetch(API+"/user/"+user.id);
let data = await res.json();

state.coins = data.coins;
state.usdt = data.usdt;

render();
}

/* RENDER */
function render(){
coins.innerText = Math.floor(state.coins);
usdt.innerText = state.usdt.toFixed(3);
}

/* TAP */
async function tap(e){
e.preventDefault();

let fingers = e.touches ? Math.min(e.touches.length,4) : 1;

let res = await fetch(API+"/tap",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:user.id,fingers})
});

let data = await res.json();

state.coins = data.coins;
state.usdt = data.usdt;

render();
}

tapBtn.addEventListener("touchstart",tap,{passive:false});
tapBtn.addEventListener("click",tap);

/* TASK */
async function task(type){

let links = {
telegram:"https://t.me/gangs234",
youtube:"https://youtube.com/@Mamme234",
tiktok:"https://tiktok.com/@mammeliyas"
};

window.open(links[type],"_blank");

let res = await fetch(API+"/task",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:user.id,type})
});

let data = await res.json();

state.coins = data.coins;
state.usdt = data.usdt;

render();
alert(data.message);
}

/* 🚀 REAL ADS SYSTEM */
let lastAd = 0;

async function ads(){

if(Date.now() - lastAd < 30000){
alert("⏳ Wait 30 seconds");
return;
}

try{

await show_10892289(); // ✅ MUST WATCH

let res = await fetch(API+"/ads",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:user.id})
});

let data = await res.json();

state.coins = data.coins;
state.usdt = data.usdt;

render();

alert("✅ +300 coins added");

lastAd = Date.now();

}catch(e){
alert("❌ Ad not completed");
}

}

/* WITHDRAW */
async function withdraw(){

let wallet = document.getElementById("wallet").value;
let amount = parseFloat(document.getElementById("amount").value);

let res = await fetch(API+"/withdraw",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({userId:user.id,wallet,amount})
});

let data = await res.json();
alert(data.message);
}

/* COPY */
function copyRef(){
navigator.clipboard.writeText(refLink.value);
alert("Copied");
}

/* TELEGRAM */
if(user){
name.innerText=user.first_name;
uname.innerText="@"+(user.username||"user");

refLink.value =
"https://t.me/Studybuddy_2025Bot?start="+user.id;

if(user.photo_url){
photo.src=user.photo_url;
}
}

/* START */
loadUser();

</script>

</body>
</html>
