<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(180deg,#0b1220,#020617);
  color:#fff;
}

/* SCREENS */
.screen{
  display:none;
  padding:15px;
}
.active{display:block;}

/* CARD */
.card{
  background:rgba(255,255,255,0.06);
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}

/* TAP */
.tap{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:25px auto;
  background:radial-gradient(circle,#ff9800,#ff5722);
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  font-weight:bold;
  font-size:18px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
  background:linear-gradient(90deg,#ff9800,#ff5722);
  color:#fff;
}

/* TASK */
.task{
  background:#0f172a;
  padding:10px;
  margin-top:10px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#020617;
  padding:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="screen active">
  <div class="card">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="show('register')">Create Account</button>
  </div>
</div>

<!-- REGISTER -->
<div id="register" class="screen">
  <div class="card">
    <h2>Register</h2>
    <input id="remail" placeholder="Email">
    <input id="rpassword" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <button onclick="show('login')">Back</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="card">
    <h3>Coins: <span id="coins">0</span></h3>
    <h3>USDT: <span id="usdt">0</span></h3>
    <h3>Refs: <span id="refs">0</span></h3>
  </div>

  <div class="tap" onclick="tap()">
    TAP
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <div class="card">
    <h3>Tasks</h3>
    <div id="tasks"></div>
  </div>

  <div class="card">
    <h3>Leaderboard</h3>
    <div id="board"></div>
  </div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">
  <div class="card">
    <h3>Withdraw</h3>
    <p id="status"></p>
  </div>

  <button onclick="withdraw()">Withdraw</button>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('profile')">Profile</button>
  <button onclick="show('withdraw')">Withdraw</button>
</div>

<script>

const API="https://YOUR-BACKEND.onrender.com";
let token = localStorage.getItem("token");

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* LOGIN */
async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(API+"/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,password})
  });

  const data = await res.json();

  if(data.token){
    token = data.token;
    localStorage.setItem("token",token);
    show("home");
    load();
  }else{
    alert(data.message || "Login failed");
  }
}

/* REGISTER */
async function register(){

  const email = document.getElementById("remail").value;
  const password = document.getElementById("rpassword").value;

  const res = await fetch(API+"/api/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email,password})
  });

  const data = await res.json();

  if(data.token){
    token = data.token;
    localStorage.setItem("token",token);
    show("home");
    load();
  }else{
    alert(data.message || "Register failed");
  }
}

/* SAFE API */
async function api(url,method="GET",body){

  if(!token){
    alert("Please login first");
    show("login");
    return;
  }

  const res = await fetch(API+url,{
    method,
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+token
    },
    body:body?JSON.stringify(body):null
  });

  return res.json();
}

/* TAP */
async function tap(){
  await api("/api/tap","POST");
  load();
}

/* TASK */
async function task(id){
  await api("/api/task","POST",{taskId:id});
  load();
}

/* WITHDRAW */
async function withdraw(){
  const address = prompt("Address");
  const amount = prompt("Amount");

  const res = await api("/api/withdraw","POST",{address,amount});
  alert(res.message);
}

/* LOAD */
async function load(){

  const u = await api("/api/user");
  if(!u) return;

  document.getElementById("coins").innerText = u.coins;
  document.getElementById("usdt").innerText = u.usdt;
  document.getElementById("refs").innerText = u.referrals;

  const tasks = await fetch(API+"/api/tasks").then(r=>r.json());

  document.getElementById("tasks").innerHTML =
    tasks.map(t=>`
      <div class="task">
        <span>${t.title}</span>
        <button onclick="task('${t._id}')">+${t.reward}</button>
      </div>
    `).join("");

  const board = await fetch(API+"/api/leaderboard").then(r=>r.json());

  document.getElementById("board").innerHTML =
    board.map((u,i)=>`
      <div>#${i+1} ${u.email} ⭐ ${u.coins}</div>
    `).join("");

  document.getElementById("status").innerText =
    (u.referrals >= 10 || u.depositVerified)
    ? "Ready to withdraw"
    : "Need 10 refs or $5 deposit";
}

load();

</script>

</body>
      </html>
