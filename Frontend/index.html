<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Pro Earn</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script
src='//libtl.com/sdk.js'
data-zone='10892289'
data-sdk='show_10892289'>
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:linear-gradient(to bottom,#0f172a,#020617);
color:white;
min-height:100vh;
}

.topbar{
background:#111827;
padding:15px;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid #1e293b;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
background:#22c55e;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
color:white;
}

.name{
font-size:18px;
font-weight:bold;
}

.uid{
font-size:13px;
color:#94a3b8;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
border-radius:24px;
padding:25px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

.title{
font-size:20px;
margin-bottom:15px;
color:#cbd5e1;
}

.balance{
font-size:42px;
font-weight:bold;
color:#22c55e;
margin:20px 0;
}

.watch{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(45deg,#22c55e,#16a34a);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px rgba(34,197,94,.4);
transition:.2s;
}

.watch:active{
transform:scale(.96);
}

.info{
margin-top:20px;
font-size:14px;
color:#94a3b8;
}

.loading{
opacity:.6;
pointer-events:none;
}

</style>
</head>

<body>

<div class="topbar">

<div class="avatar" id="avatar">
U
</div>

<div>
<div class="name" id="tgname">
Telegram User
</div>

<div class="uid">
ID:
<span id="uid"></span>
</div>
</div>

</div>

<div class="container">

<div class="card">

<div class="title">
Your Balance
</div>

<div class="balance">
$<span id="usdt">0.00</span>
</div>

<button class="watch" id="watchBtn" onclick="watchAd()">
Watch Ad & Earn
</button>

<div class="info">
Earn 0.03 USDT for every completed ad
</div>

</div>

</div>

<script>

const BACKEND =
"https://crypto-4bbj.onrender.com";

let userId = "guest";
let tgName = "Telegram User";
let avatarLetter = "U";

// ================= TELEGRAM USER =================

if(window.Telegram && Telegram.WebApp){

Telegram.WebApp.ready();

const tgUser =
Telegram.WebApp.initDataUnsafe.user;

if(tgUser){

userId = String(tgUser.id);

tgName = tgUser.username
? "@"+tgUser.username
: tgUser.first_name;

avatarLetter =
tgName.replace("@","")
.charAt(0)
.toUpperCase();

}

}

document.getElementById("uid").innerText =
userId;

document.getElementById("tgname").innerText =
tgName;

document.getElementById("avatar").innerText =
avatarLetter;

// ================= LOAD PROFILE =================

async function loadProfile(){

try{

let res = await fetch(
`${BACKEND}/profile/${userId}/${encodeURIComponent(tgName)}`
);

let data = await res.json();

document.getElementById("usdt").innerText =
Number(data.usdt || 0).toFixed(2);

}catch(err){

console.log(err);

}

}

loadProfile();

// ================= WATCH AD =================

async function watchAd(){

const btn =
document.getElementById("watchBtn");

try{

btn.innerText = "Loading Ad...";
btn.classList.add("loading");

const result =
await show_10892289();

console.log(result);

// CHECK COMPLETION

if(result === true || result?.done){

// INSTANT UI UPDATE

let current =
parseFloat(
document.getElementById("usdt").innerText
) || 0;

current += 0.03;

document.getElementById("usdt").innerText =
current.toFixed(2);

// SAVE TO BACKEND

let res = await fetch(
`${BACKEND}/ads`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
userId
})
}
);

let data = await res.json();

if(data.success){

document.getElementById("usdt").innerText =
Number(data.usdt).toFixed(2);

alert("+0.03 USDT Added!");

}else{

alert(data.message || "Reward failed");

}

}else{

alert("Watch full ad to earn");

}

}catch(err){

console.log(err);

alert("Ad closed or failed");

}

btn.innerText = "Watch Ad & Earn";
btn.classList.remove("loading");

}

</script>

</body>
</html>
