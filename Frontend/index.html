<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Tap Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:48px;
height:48px;
border-radius:50%;
border:2px solid #facc15;
box-shadow:0 0 15px rgba(250,204,21,0.5);
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
margin-top:12px;
}

.box{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:14px;
width:40%;
text-align:center;
backdrop-filter:blur(8px);
}

.box strong{
display:block;
font-size:20px;
color:#facc15;
}

/* TAP */
.tap{
display:flex;
justify-content:center;
margin-top:70px;
}

.tap button{
width:220px;
height:220px;
border-radius:50%;
border:none;
font-size:22px;
font-weight:bold;
color:#111;
background:radial-gradient(circle,#ffe066,#facc15);
box-shadow:0 0 40px rgba(250,204,21,0.6);
}

/* SCREEN */
.screen{
display:none;
padding:15px;
animation:fade 0.2s ease;
}

.active{display:block;}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.6);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
border:none;
}

/* PROFILE DESIGN (NEW) */
.profileCard{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:18px;
margin-top:10px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
}

.profileHeader{
display:flex;
align-items:center;
gap:10px;
}

.profileHeader img{
width:60px;
height:60px;
border-radius:50%;
border:2px solid gold;
}

.badge{
background:gold;
color:black;
padding:3px 8px;
border-radius:10px;
font-size:12px;
margin-left:10px;
}

/* INPUTS */
input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
margin-top:8px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div class="user">
<img id="photo">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Lv <span id="level">1</span></div>
</div>

<div class="stats">
<div class="box">Coins<strong id="coins">0</strong></div>
<div class="box">USDT<strong id="usdt">0.000</strong></div>
</div>

<div class="tap">
<button id="tapBtn">TAP</button>
</div>

</div>

<!-- PROFILE (ATTRACTIVE FULL HUB) -->
<div id="profile" class="screen">

<div class="profileCard">

<div class="profileHeader">
<img id="pPhoto">
<div>
<h3 id="pName">User</h3>
<span class="badge">VIP Player</span>
</div>
</div>

<p id="pUser"></p>

</div>

<!-- REF -->
<div class="profileCard">
<h3>🔗 Referral Link</h3>
<input id="refLink" readonly>
<button onclick="copyRef()" style="width:100%;margin-top:5px">
Copy Link
</button>
</div>

<!-- TASKS -->
<div class="profileCard">
<h3>🔥 Social Tasks</h3>
<button onclick="task('telegram')" style="width:100%">Telegram (+500)</button>
<button onclick="task('youtube')" style="width:100%;margin-top:5px">YouTube (+1000)</button>
<button onclick="task('tiktok')" style="width:100%;margin-top:5px">TikTok (+700)</button>
</div>

<!-- ADS -->
<div class="profileCard">
<h3>💰 Ads Reward</h3>
<button onclick="ads()" style="width:100%">Watch Ad (+300)</button>
</div>

<!-- WITHDRAW -->
<div class="profileCard">
<h3>💸 Withdraw</h3>

<input id="wallet" placeholder="Wallet address">
<input id="amount" placeholder="Amount USDT">

<button onclick="withdraw()" style="width:100%;margin-top:5px">
Withdraw
</button>

</div>

</div>

<!-- DEPOSIT -->
<div id="deposit" class="screen">

<div class="profileCard">
<h2>💰 Deposit</h2>

<input id="depWallet" readonly
value="UQAYjMccjJ8Xn1z9hodUImMjJCB2qmWGjlMup9-sVZtEQFWH">

<button onclick="copyWallet()" style="width:100%;margin-top:10px">
Copy Address
</button>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('deposit')">Deposit</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

let state = {
coins:0,
usdt:0
};

/* SAVE SYSTEM */
function save(){
localStorage.setItem("coins",state.coins);
localStorage.setItem("usdt",state.usdt);
}

function load(){
state.coins = parseFloat(localStorage.getItem("coins"))||0;
state.usdt = parseFloat(localStorage.getItem("usdt"))||0;
}

/* LOAD */
load();

/* ELEMENTS */
const coinsEl = document.getElementById("coins");
const usdtEl = document.getElementById("usdt");
const tapBtn = document.getElementById("tapBtn");

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* RENDER */
function render(){
coinsEl.innerText = Math.floor(state.coins);
usdtEl.innerText = state.usdt.toFixed(3);
save();
}

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

if(user){

document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"user");

document.getElementById("pName").innerText=user.first_name;
document.getElementById("pUser").innerText="ID: "+user.id;

document.getElementById("refLink").value=
"https://t.me/Studybuddy_2025Bot?start="+user.id;

if(user.photo_url){
document.getElementById("photo").src=user.photo_url;
document.getElementById("pPhoto").src=user.photo_url;
}
}

/* TAP */
tapBtn.addEventListener("touchstart",tap,{passive:false});
tapBtn.addEventListener("click",tap);

function tap(e){

e.preventDefault();

let fingers = e.touches ? Math.min(e.touches.length,4) : 1;

state.coins += fingers;
state.usdt = state.coins / 1000;

document.getElementById("level").innerText =
Math.floor(state.coins/5000)+1;

render();
}

/* TASKS */
function task(type){

let reward = type==="telegram"?500:type==="youtube"?1000:700;

setTimeout(()=>{
state.coins += reward;
state.usdt = state.coins/1000;
render();
alert("Task completed!");
},3000);

}

/* ADS */
function ads(){
state.coins += 300;
state.usdt = state.coins/1000;
render();
}

/* WITHDRAW */
function withdraw(){

let w=document.getElementById("wallet").value;
let a=parseFloat(document.getElementById("amount").value);

if(a<20){alert("Min 20 USDT");return;}
if(a>state.usdt){alert("Not enough");return;}

alert("Withdraw sent!");
}

/* COPY */
function copyRef(){
navigator.clipboard.writeText(document.getElementById("refLink").value);
alert("Copied");
}

function copyWallet(){
navigator.clipboard.writeText(document.getElementById("depWallet").value);
alert("Copied");
}

render();

</script>

</body>
</html>
