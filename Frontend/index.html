<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Pro Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ADS SDK -->
  <script src="//libtl.com/sdk.js" data-zone="10892289" data-sdk="show_10892289"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
    }

    .topbar {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .userinfo {
      flex: 1;
    }

    .name {
      font-size: 16px;
      font-weight: bold;
    }

    .uid {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .profileCard {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      margin: 20px;
      padding: 20px;
      border-radius: 24px;
    }

    .profileTop {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .profileAvatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    .profileStats {
      display: flex;
      gap: 10px;
    }

    .pbox {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 16px;
      text-align: center;
    }

    .pbox h3 {
      font-size: 20px;
      font-weight: bold;
    }

    .pbox p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px;
      text-align: center;
    }

    .card h2 {
      font-size: 18px;
      opacity: 0.9;
    }

    .balance {
      font-size: 48px;
      font-weight: bold;
      color: #22c55e;
      margin: 20px 0;
    }

    .watch {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .watch:active {
      transform: scale(0.98);
    }

    .watch:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .withdrawBtn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .supportBtn {
      background: linear-gradient(135deg, #0088cc, #006699);
    }

    .info {
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.8;
    }

    .progress {
      margin-top: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      overflow: hidden;
      height: 8px;
    }

    .progressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 0.3s ease;
    }

    .rules {
      margin-top: 25px;
      text-align: left;
      font-size: 13px;
      line-height: 1.8;
      opacity: 0.8;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 16px;
    }

    .rules p {
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="avatar" id="avatar">U</div>
    <div class="userinfo">
      <div class="name" id="tgname">Telegram User</div>
      <div class="uid">ID: <span id="uid"></span></div>
    </div>
  </div>

  <div class="profileCard">
    <div class="profileTop">
      <div class="profileAvatar" id="profileAvatar">U</div>
      <div>
        <h2 id="profileName">Telegram User</h2>
        <p id="profileUsername" style="opacity:0.7; font-size:12px;">@username</p>
      </div>
    </div>
    <div class="profileStats">
      <div class="pbox">
        <h3 id="profileBalance">0.00</h3>
        <p>USDT</p>
      </div>
      <div class="pbox">
        <h3 id="profileRefs">0</h3>
        <p>Referrals</p>
      </div>
      <div class="pbox">
        <h3 id="profileAds">0</h3>
        <p>Ads</p>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>💰 Your Balance</h2>
      <div class="balance">$<span id="usdt">0.00</span></div>

      <button class="watch" id="watchBtn" onclick="watchAd()">
        📺 Watch Ad & Earn
      </button>
      
      <button class="watch withdrawBtn" onclick="withdrawNow()">
        💸 Withdraw
      </button>
      
      <a href="https://t.me/Studybuddy_2025Bot_helperBot" target="_blank">
        <button class="watch supportBtn">
          📞 Contact Support
        </button>
      </a>

      <div class="info">✨ Earn 0.03 USDT per ad ✨</div>

      <div class="progress">
        <div class="progressBar" id="progressBar"></div>
      </div>
      <div class="info" id="progressText">0 / 500 Ads Completed</div>

      <div class="rules">
        📋 Withdrawal Rules
        <p>• Minimum: <strong>5 USDT</strong></p>
        <p>• Need: <strong>10 Referrals</strong></p>
        <p>• Watch: <strong>500 Ads</strong></p>
        <p>• Reward per ad: <strong>0.03 USDT</strong></p>
        <p>• Referral reward: <strong>0.10 USDT</strong></p>
      </div>
    </div>
  </div>

  <script>
    // ================= CONFIG =================
    const BACKEND = "https://crypto-4bbj.onrender.com";
    // Make sure this matches your backend SECRET_KEY
    const SECRET_KEY = "META_9xK2_secure_2026";

    // ================= USER DATA =================
    let userId = "guest";
    let tgName = "Telegram User";
    let firstName = "User";
    let avatarLetter = "U";

    // ================= TELEGRAM INIT =================
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      
      const tgUser = Telegram.WebApp.initDataUnsafe.user;
      
      if (tgUser) {
        userId = String(tgUser.id);
        tgName = tgUser.username ? "@" + tgUser.username : "@user" + userId;
        firstName = tgUser.first_name || "User";
        avatarLetter = firstName.charAt(0).toUpperCase();
      }
    }

    // ================= UPDATE UI =================
    document.getElementById("uid").innerText = userId;
    document.getElementById("tgname").innerText = tgName;
    document.getElementById("avatar").innerText = avatarLetter;
    document.getElementById("profileAvatar").innerText = avatarLetter;
    document.getElementById("profileName").innerText = firstName;
    document.getElementById("profileUsername").innerText = tgName;

    // ================= LOAD PROFILE =================
    async function loadProfile() {
      try {
        const res = await fetch(`${BACKEND}/profile/${userId}`);
        const data = await res.json();

        const balance = Number(data.balance || 0).toFixed(2);
        document.getElementById("usdt").innerText = balance;
        document.getElementById("profileBalance").innerText = balance;
        document.getElementById("profileRefs").innerText = data.refs || 0;
        document.getElementById("profileAds").innerText = data.adsWatched || 0;

        // Progress bar
        const ads = data.adsWatched || 0;
        const percent = Math.min((ads / 500) * 100, 100);
        document.getElementById("progressBar").style.width = percent + "%";
        document.getElementById("progressText").innerText = `${ads} / 500 Ads Completed`;

      } catch (err) {
        console.error("Profile load error:", err);
      }
    }

    loadProfile();

    // ================= WATCH AD =================
    async function watchAd() {
      const btn = document.getElementById("watchBtn");
      
      try {
        btn.disabled = true;
        btn.innerText = "⏳ Loading Ad...";

        // Check if ad SDK is available
        if (typeof show_10892289 === "undefined") {
          alert("Ad SDK failed to load. Please try again.");
          btn.disabled = false;
          btn.innerText = "📺 Watch Ad & Earn";
          return;
        }

        // Show ad
        await show_10892289();

        // Send reward to backend
        const res = await fetch(`${BACKEND}/ads`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "authorization": SECRET_KEY
          },
          body: JSON.stringify({ userId })
        });

        const data = await res.json();

        if (data.success) {
          alert(`✅ +${data.reward || 0.03} USDT Added!\n\nNew Balance: ${data.balance.toFixed(2)} USDT`);
          loadProfile();
        } else {
          alert(data.message || "Failed to get reward. Please try again.");
        }

      } catch (err) {
        console.error("Ad error:", err);
        alert("Ad failed or was closed. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "📺 Watch Ad & Earn";
      }
    }

    // ================= WITHDRAW =================
    async function withdrawNow() {
      const amount = prompt("💰 Enter amount to withdraw (Min: 5 USDT):", "5");
      
      if (!amount) return;
      
      const numAmount = parseFloat(amount);
      
      if (isNaN(numAmount) || numAmount < 5) {
        alert("Minimum withdrawal is 5 USDT");
        return;
      }

      try {
        const res = await fetch(`${BACKEND}/withdraw`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            userId: userId,
            amount: numAmount
          })
        });

        const data = await res.json();

        if (data.success) {
          alert("✅ " + data.message + "\n\nPlease check Telegram to complete withdrawal.");
          loadProfile();
        } else {
          alert("❌ " + data.message);
        }
      } catch (err) {
        console.error("Withdraw error:", err);
        alert("Withdrawal failed. Please try again.");
      }
    }

    // Refresh profile every 10 seconds
    setInterval(loadProfile, 10000);
  </script>
</body>

  </html>
