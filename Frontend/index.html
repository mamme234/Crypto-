<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Meta Pro Earn V2</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.card{
margin:20px;
padding:20px;
background:#1e293b;
border-radius:20px;
}

button{
padding:15px;
width:85%;
margin:10px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
font-size:16px;
}
</style>
</head>

<body>

<div class="card">
<h2>Balance: $<span id="bal">0.00</span></h2>
<p>Ads: <span id="ads">0</span></p>
<p>Refs: <span id="refs">0</span></p>

<button onclick="watchAd()">Watch Ad (+0.03)</button>
<button onclick="withdraw()">Withdraw</button>
</div>

<script>

let userId = "guest";

/* Telegram ID */
if(window.Telegram){
Telegram.WebApp.ready();
const u = Telegram.WebApp.initDataUnsafe.user;
if(u) userId = String(u.id);
}

function n(v){
return isNaN(Number(v)) ? 0 : Number(v);
}

/* LOAD PROFILE */
async function load(){
const r = await fetch(`/profile/${userId}`);
const d = await r.json();

document.getElementById("bal").innerText = n(d.balance).toFixed(2);
document.getElementById("ads").innerText = d.adsWatched;
document.getElementById("refs").innerText = d.refs;
}

load();

/* WATCH AD */
async function watchAd(){

await show_10892289();

await fetch("/ads",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ userId })
});

load();
}

/* WITHDRAW */
async function withdraw(){

const amount = prompt("Enter amount:");

await fetch("/withdraw",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
userId,
amount:Number(amount)
})
});

alert("Request sent");
}

</script>

</body>
</html>
