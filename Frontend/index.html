<!DOCTYPE html>
<html>
<head>
<title>Earn Pro App</title>

<script src="https://libtl.com/sdk.js"
data-zone="3304242"
data-sdk="show_3304242"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:10px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{text-align:center;}
.stat strong{font-size:20px;color:#facc15;}
.tap{width:220px;margin:auto;}
.tap img{width:200px;border-radius:50%;}
button{width:100%;padding:10px;margin-top:5px;}
.nav{position:fixed;bottom:0;width:100%;display:flex;background:#111;}
.nav button{flex:1;}
</style>
</head>

<body>

<div class="card grid">
<div class="stat">Coins<br><strong id="coins">0</strong></div>
<div class="stat">USDT<br><strong id="usdt">0</strong></div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
</div>

<div class="card">
<button onclick="task('telegram')">Telegram +500</button>
<button onclick="task('tiktok')">TikTok +700</button>
<button onclick="task('youtube')">YouTube +1000</button>
</div>

<div class="card">
<input id="addr" placeholder="Wallet">
<input id="amt" placeholder="Amount">
<button onclick="withdraw()">Withdraw</button>
</div>

<div class="nav">
<button onclick="show()">Home</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token;

const tg=window.Telegram.WebApp;
const user=tg.initDataUnsafe.user;

/* LOGIN */
async function login(){
const res=await fetch(API+"/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
ref:user.username
})
});
const d=await res.json();
token=d.token;
load();
}
login();

/* LOAD */
async function load(){
const r=await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
});
const d=await r.json();
coins.innerText=d.coins;
usdt.innerText=d.usdt;
}

/* TAP */
tapArea.addEventListener("touchstart",async e=>{
let f=Math.min(e.touches.length,4);

const r=await fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:f})
});

const d=await r.json();
coins.innerText=d.coins;
usdt.innerText=d.usdt;
});

/* TASK */
async function task(t){
await fetch(API+"/api/task",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({type:t})
});
load();
}

/* WITHDRAW */
async function withdraw(){
await fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
amount:amt.value,
address:addr.value
})
});
alert("Sent");
}

</script>

</body>
</html>
