<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
margin:10px;
border-radius:16px;
backdrop-filter: blur(10px);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

/* TAP BUTTON */
.tap{
width:270px;
height:270px;
border-radius:50%;
margin:30px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
box-shadow:0 0 40px rgba(255,152,0,0.6);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
position:relative;
overflow:hidden;
touch-action: none;
}

/* TAP EFFECT */
.wave{
position:absolute;
border:2px solid #fff;
border-radius:50%;
width:20px;
height:20px;
opacity:0.7;
animation:wave 0.5s ease-out forwards;
}

@keyframes wave{
0%{transform:scale(1);opacity:0.7;}
100%{transform:scale(7);opacity:0;}
}

/* COIN FLY */
.fly-coin{
position:fixed;
color:#ffcc00;
font-weight:bold;
font-size:18px;
animation:fly 0.6s ease-out forwards;
pointer-events:none;
}

@keyframes fly{
0%{transform:translate(0,0);opacity:1;}
100%{transform:translate(90px,-180px);opacity:0;}
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:white;
}

/* COPY BUTTON */
.copy-btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
background:linear-gradient(135deg,#ff9800,#ff5722);
color:white;
font-weight:bold;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">TAP</div>

<div style="text-align:center;color:#aaa;font-size:12px">
Max tap: 4 fingers = 4 coins
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card">
<h3>User Info</h3>
<p id="username"></p>
<p id="userid"></p>
</div>

<div class="card">
<h3>Referral Link</h3>
<p id="refLink"></p>

<button class="copy-btn" onclick="copyRef()">
📋 Copy Referral Link
</button>
</div>

<div class="card">
<h3>Social Tasks</h3>
<button onclick="task('telegram')">Telegram</button>
<button onclick="task('tiktok')">TikTok</button>
<button onclick="task('youtube')">YouTube</button>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Deposit Wallet</h3>
<p id="wallet"></p>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0, usdtVal=0, refsVal=0;

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

// TELEGRAM
const tg=window.Telegram.WebApp;
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

// LOAD USER
async function load(){

const u=await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
}).then(r=>r.json());

coinsVal=u.coins;
usdtVal=u.usdt;
refsVal=u.referrals;

updateUI();

// user info
username.innerText="Name: "+u.name;
userid.innerText="ID: "+tg.initDataUnsafe.user.id;

// referral
refLink.innerText =
"👤 "+u.name+"\n\n"+
"https://t.me/Studybuddy_2025Bot?start="+tg.initDataUnsafe.user.id;

// wallet
const w=await fetch(API+"/api/wallet").then(r=>r.json());
wallet.innerText=w.ton;
}

function updateUI(){
coins.innerText=coinsVal;
usdt.innerText=usdtVal;
refs.innerText=refsVal;
level.innerText=Math.floor((coinsVal+usdtVal*1000)/1000)+1;
}

// vibration
function vibrate(){
if(navigator.vibrate) navigator.vibrate(30);
}

// effects
function wave(el){
const w=document.createElement("div");
w.className="wave";
el.appendChild(w);
setTimeout(()=>w.remove(),500);
}

function fly(x,y,val){
const c=document.createElement("div");
c.className="fly-coin";
c.innerText="+"+val;
c.style.left=x+"px";
c.style.top=y+"px";
document.body.appendChild(c);
setTimeout(()=>c.remove(),600);
}

// TAP FIX (NO STACK BUG)
let tapping=false;

const tapArea=document.getElementById("tapArea");

tapArea.addEventListener("touchstart",async(e)=>{

if(tapping) return;
tapping=true;

let fingers=e.touches.length;
if(fingers>4) fingers=4;
if(fingers<1) fingers=1;

// effects
wave(tapArea);

const rect=tapArea.getBoundingClientRect();
fly(rect.left+rect.width/2,rect.top+rect.height/2,fingers);

vibrate();

try{
const res=await fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});

const data=await res.json();

coinsVal=data.coins;
usdtVal=data.usdt;

updateUI();

}catch{}

setTimeout(()=>tapping=false,100);

});

// COPY REFERRAL
function copyRef(){
const link="https://t.me/Studybuddy_2025Bot?start="+tg.initDataUnsafe.user.id;
navigator.clipboard.writeText(link);
alert("Copied!");
}

// TASKS
async function task(type){

let url=
type==="telegram"
?"https://t.me/gangs234"
:type==="tiktok"
?"https://tiktok.com/@mammeliyas"
:"https://youtube.com/@Mamme234";

window.open(url,"_blank");

await fetch(API+"/api/task",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({type})
});

load();
}

load();

</script>

</body>
  </html>
