<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Earn App</title>

<script src="https://libtl.com/sdk.js"
data-zone="3304242"
data-sdk="show_3304242"></script>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff;}
.screen{display:none;padding:10px;}
.active{display:block;}

.card{background:#111;padding:10px;margin:10px;border-radius:10px;}
.stat strong{color:orange;}
.tap{width:200px;height:200px;margin:auto;display:flex;justify-content:center;align-items:center;}
.tap img{width:180px;}
button{width:100%;padding:10px;margin-top:5px;}
</style>
</head>

<body>

<div id="home" class="screen active">
<div class="card">
Coins: <strong id="coins">0</strong><br>
USDT: <strong id="usdt">0</strong><br>
Refs: <strong id="refs">0</strong>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
</div>
</div>

<div id="profile" class="screen">
<div class="card">
<h3 id="name"></h3>
<p id="refLink"></p>
</div>
</div>

<div id="withdraw" class="screen">
<div class="card">
<input id="amount" placeholder="amount">
<input id="addr" placeholder="wallet">
<button onclick="withdraw()">Withdraw</button>
</div>
</div>

<div id="ads" class="screen">
<div class="card">
<button onclick="watchAd()">Watch Ad</button>
</div>
</div>

<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('ads')">Ads</button>

<script>
const API="https://crypto-4bbj.onrender.com";
let coins=0,usdt=0,refs=0;

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function update(){
usdt=Math.floor(coins/1000);
coinsEl.innerText=coins;
usdtEl.innerText=usdt;
refsEl.innerText=refs;
}

// TAP
tapArea.addEventListener("touchstart",(e)=>{
let f=Math.min(e.touches.length,4);
coins+=f;
update();

fetch(API+"/api/tap",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({multi:f})});
});

// TASK
function task(t){
fetch(API+"/api/task",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:t})});
}

// WITHDRAW
function withdraw(){
fetch(API+"/api/withdraw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
amount:amount.value,
address:addr.value
})});
}

// ADS
function watchAd(){
show_3304242().then(()=>{
coins+=500;
update();
});
}

</script>

</body>
</html>
