<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Tap Game</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);
color:white;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:46px;
height:46px;
border-radius:50%;
border:2px solid #facc15;
box-shadow:0 0 15px rgba(250,204,21,0.5);
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
margin-top:12px;
}

.box{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:14px;
width:40%;
text-align:center;
backdrop-filter:blur(8px);
}

.box strong{
display:block;
font-size:20px;
color:#facc15;
}

/* TAP */
.tap{
display:flex;
justify-content:center;
margin-top:70px;
}

.tap button{
width:220px;
height:220px;
border-radius:50%;
border:none;
font-size:22px;
font-weight:bold;
color:#111;
background:radial-gradient(circle,#ffe066,#facc15);
box-shadow:0 0 40px rgba(250,204,21,0.6);
transition:0.15s;
}

.tap button:active{
transform:scale(0.92);
}

/* SCREENS */
.screen{
display:none;
padding:15px;
animation:fade 0.2s ease;
}

.active{display:block;}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

/* INPUTS */
input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
margin-top:8px;
}

/* BUTTONS */
button{
border:none;
border-radius:10px;
padding:12px;
font-weight:bold;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
border-top:1px solid rgba(255,255,255,0.1);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
font-size:13px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div class="user">
<img id="photo">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Lv <span id="level">1</span></div>
</div>

<div class="stats">
<div class="box">Coins<strong id="coins">0</strong></div>
<div class="box">USDT<strong id="usdt">0.000</strong></div>
</div>

<div class="tap">
<button id="tapBtn">TAP</button>
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<h2>Profile</h2>

<p id="pName"></p>
<p id="pUser"></p>

<h3>Referral Link</h3>
<input id="refLink" readonly>
<button onclick="copyRef()" style="width:100%;margin-top:8px">
Copy Link
</button>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<h2>Withdraw</h2>

<p>Min: 20 USDT</p>

<input id="wallet" placeholder="Wallet address">
<input id="amount" placeholder="Amount USDT">

<button onclick="withdraw()" style="width:100%;margin-top:10px">
Withdraw
</button>

</div>

<!-- DEPOSIT -->
<div id="deposit" class="screen">

<h2>Deposit</h2>

<input id="depWallet" readonly
value="UQAYjMccjJ8Xn1z9hodUImMjJCB2qmWGjlMup9-sVZtEQFWH">

<button onclick="copyWallet()" style="width:100%;margin-top:10px">
Copy Address
</button>

</div>

<!-- ADS -->
<div id="ads" class="screen">
<h2>Ads</h2>
<button onclick="alert('Ad clicked')">Watch Ad</button>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('deposit')">Deposit</button>
<button onclick="show('ads')">Ads</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

let state = {
coins:0,
usdt:0
};

/* ELEMENTS */
const coinsEl = document.getElementById("coins");
const usdtEl = document.getElementById("usdt");
const tapBtn = document.getElementById("tapBtn");

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* RENDER */
function render(){
coinsEl.innerText = Math.floor(state.coins);
usdtEl.innerText = state.usdt.toFixed(3);
}

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

if(user){

document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"user");

document.getElementById("pName").innerText="Name: "+user.first_name;
document.getElementById("pUser").innerText="ID: "+user.id;

document.getElementById("refLink").value=
"https://t.me/Studybuddy_2025Bot?start="+user.id;

if(user.photo_url){
document.getElementById("photo").src=user.photo_url;
}
}

/* TAP SYSTEM (FIXED 1–4 FINGERS EXACT) */
tapBtn.addEventListener("touchstart",tap,{passive:false});
tapBtn.addEventListener("click",tap);

function tap(e){

e.preventDefault();

let fingers = 1;

if(e.touches){
fingers = e.touches.length;
}

if(fingers > 4) fingers = 4;

/* EXACT COIN RULE */
state.coins += fingers;

/* USDT */
state.usdt = state.coins / 1000;

document.getElementById("level").innerText =
Math.floor(state.coins / 5000) + 1;

render();
}

/* WITHDRAW */
function withdraw(){

let w = document.getElementById("wallet").value;
let a = parseFloat(document.getElementById("amount").value);

if(a < 20){
alert("Minimum 20 USDT");
return;
}

if(a > state.usdt){
alert("Not enough balance");
return;
}

alert("Withdraw request sent!");
}

/* COPY REF */
function copyRef(){
navigator.clipboard.writeText(document.getElementById("refLink").value);
alert("Copied");
}

/* COPY DEP */
function copyWallet(){
navigator.clipboard.writeText(document.getElementById("depWallet").value);
alert("Copied");
}

render();

</script>

</body>
  </html>
