<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.06);
padding:15px;
margin:10px;
border-radius:16px;
backdrop-filter: blur(10px);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

/* TAP */
.tap{
width:260px;
height:260px;
border-radius:50%;
margin:30px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
box-shadow:0 0 40px rgba(255,152,0,0.6);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
font-size:22px;
font-weight:bold;
touch-action:none;
}

/* coin image */
.tap img{
width:60px;
margin-bottom:10px;
}

/* animation */
.tap:active{
transform:scale(0.92);
}

/* social buttons */
.task-btn{
background:linear-gradient(135deg,#229ED9,#0072ff);
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
color:#fff;
font-weight:bold;
}

/* copy */
.copy-btn{
background:linear-gradient(135deg,#ff9800,#ff5722);
padding:12px;
border:none;
border-radius:10px;
color:#fff;
margin-top:10px;
}

/* nav */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">
<img src="https://cdn-icons-png.flaticon.com/512/138/138292.png">
TAP
</div>

<div style="text-align:center;font-size:12px;color:#aaa">
1 finger = 1 coin | max 4 fingers
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:80px;height:80px;border-radius:50%">
<h3 id="username"></h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>Your Referral</h3>
<p id="refLink"></p>
<button class="copy-btn" onclick="copyRef()">Copy Link</button>
</div>

<div class="card">
<h3>Social Tasks</h3>
<button class="task-btn" onclick="task('telegram')">Join Telegram</button>
<button class="task-btn" onclick="task('tiktok')">Follow TikTok</button>
<button class="task-btn" onclick="task('youtube')">Subscribe YouTube</button>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Withdraw Rules</h3>
<p>• Minimum withdraw: 20 USDT</p>
<p>• Need 10 referrals OR deposit 5 USDT</p>
</div>

<div class="card">
<h3>Deposit Wallet</h3>
<p id="wallet"></p>
<button class="copy-btn" onclick="copyWallet()">Copy Address</button>
</div>

<div class="card">
<h3>Withdraw</h3>
<input id="wAddress" placeholder="Your wallet address" style="width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;">
<input id="wAmount" placeholder="Amount" style="width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;">
<button class="copy-btn" onclick="withdraw()">Submit Withdraw</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0, usdtVal=0, refsVal=0;

// screen
function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

// telegram
const tg=window.Telegram.WebApp;
tg.expand();

const user=tg.initDataUnsafe?.user;

if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name,
photo:user.photo_url
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

// load
async function load(){
const u=await fetch(API+"/api/user",{headers:{Authorization:"Bearer "+token}}).then(r=>r.json());

coinsVal=u.coins;
usdtVal=u.usdt;
refsVal=u.referrals;

updateUI();

username.innerText=u.name;
userid.innerText="ID: "+user.id;

if(u.photo) photo.src=u.photo;

refLink.innerText="https://t.me/Studybuddy_2025Bot?start="+user.id;

const w=await fetch(API+"/api/wallet").then(r=>r.json());
wallet.innerText=w.ton;
}

function updateUI(){
coins.innerText=coinsVal;
usdt.innerText=usdtVal;
refs.innerText=refsVal;
level.innerText=Math.floor((coinsVal+usdtVal*1000)/1000)+1;
}

// 🚀 FAST TAP (NO STACK, SPEED BASED)
tapArea.addEventListener("touchstart",(e)=>{

let fingers=e.touches.length;
if(fingers>4) fingers=4;

coinsVal+=fingers;
updateUI();

// send async (no wait)
fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});

});

// copy
function copyRef(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

function copyWallet(){
navigator.clipboard.writeText(wallet.innerText);
alert("Copied");
}

// tasks
function task(type){
window.open(
type==="telegram"?"https://t.me/gangs234":
type==="tiktok"?"https://tiktok.com/@mammeliyas":
"https://youtube.com/@Mamme234"
);
}

// withdraw
function withdraw(){
fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({
address:wAddress.value,
amount:wAmount.value
})
});
alert("Request sent");
}

load();

</script>

</body>
</html>
