<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Meta Pro Earn</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script
src='//libtl.com/sdk.js'
data-zone='10892289'
data-sdk='show_10892289'>
</script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.topbar{
background:#111827;
padding:15px;
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
}

.userinfo{
text-align:left;
}

.card{
background:#1e293b;
margin:15px;
padding:18px;
border-radius:18px;
}

.balance{
font-size:38px;
font-weight:bold;
color:#22c55e;
margin:15px 0;
}

.watch{
width:90%;
padding:18px;
border:none;
border-radius:18px;
background:#22c55e;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<!-- PROFILE -->

<div class="topbar">

<div class="avatar" id="avatar">
U
</div>

<div class="userinfo">

<div id="tgname">
Telegram User
</div>

<small>
ID:
<span id="uid"></span>
</small>

</div>

</div>

<!-- BALANCE -->

<div class="card">

<h2>Your Balance</h2>

<div class="balance">
$<span id="usdt">0.00</span>
</div>

<button class="watch" onclick="watchAd()">
Watch Ad & Earn
</button>

</div>

<script>

// ================= TELEGRAM USER =================

let userId = "guest";
let tgName = "Telegram User";
let avatar = "U";

if(window.Telegram && Telegram.WebApp){

  Telegram.WebApp.ready();

  const tgUser =
    Telegram.WebApp.initDataUnsafe.user;

  if(tgUser){

    userId = String(tgUser.id);

    tgName =
      tgUser.username
      ? "@"+tgUser.username
      : tgUser.first_name || "Telegram User";

    avatar =
      tgName
      .replace("@","")
      .charAt(0)
      .toUpperCase();
  }
}

document.getElementById("uid").innerText =
  userId;

document.getElementById("tgname").innerText =
  tgName;

document.getElementById("avatar").innerText =
  avatar;

// ================= LOAD PROFILE =================

async function load(){

  try{

    let res = await fetch(
      "/profile/" +
      userId +
      "/" +
      encodeURIComponent(tgName)
    );

    let d = await res.json();

    document.getElementById("usdt").innerText =
      Number(d.usdt || 0).toFixed(2);

  }catch(err){

    console.log(err);
  }
}

load();

// ================= WATCH AD =================

async function watchAd(){

  try{

    await show_10892289();

    let res = await fetch("/ads",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        userId
      })
    });

    let d = await res.json();

    if(d.success){

      document.getElementById("usdt").innerText =
        Number(d.usdt).toFixed(2);

      alert("🎉 +0.03 USDT Added!");

    }else{

      alert(d.message);
    }

  }catch(err){

    console.log(err);

    alert("Ad failed or closed");

  }

}

</script>

</body>
</html>
