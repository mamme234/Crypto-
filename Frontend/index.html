<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:#fff;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{padding:15px;margin:10px;background:#111;border-radius:12px;}

.tap{
width:200px;height:200px;
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
}

.tap img{width:100%;}
</style>
</head>

<body>

<div id="home" class="screen active">
<div class="card">
Coins: <span id="coins">0</span><br>
USDT: <span id="usdt">0</span><br>
Refs: <span id="refs">0</span><br>
Level: <span id="level">1</span>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
</div>
</div>

<script>

const API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coins=0;
let usdt=0;
let refs=0;

// LOAD USER
async function load(){
const res = await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
});
const data = await res.json();

coins=data.coins;
usdt=data.usdt;
refs=data.referrals;

updateUI();
}

function updateUI(){
document.getElementById("coins").innerText=coins;
document.getElementById("usdt").innerText=usdt;
document.getElementById("refs").innerText=refs;
document.getElementById("level").innerText=Math.floor(coins/1000)+1;
}

// TAP SYSTEM FIX
let last=0;

tapArea.addEventListener("touchstart",async (e)=>{

let now=Date.now();
if(now-last<120) return;
last=now;

let fingers=Math.min(e.touches.length,4);

const res = await fetch(API+"/api/tap",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({multi:fingers})
});

const data = await res.json();

coins=data.coins;
usdt=data.usdt;

updateUI();

});

load();

</script>

</body>
</html>
