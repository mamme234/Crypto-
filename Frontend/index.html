<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<!-- ========================= -->
<!-- MONETAG AD SCRIPT -->
<!-- ========================= -->
<script src='//libtl.com/sdk.js' data-zone='10892289' data-sdk='show_10892289'></script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

.tap{
width:260px;
height:260px;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8),0 0 80px rgba(255,150,0,0.5);
animation:glow 2s infinite alternate;
}

.tap:active img{
transform:scale(0.92);
}

@keyframes glow{
from{filter:brightness(1);}
to{filter:brightness(1.4);}
}

.task-btn{
background:linear-gradient(135deg,#229ED9,#0072ff);
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
color:#fff;
font-weight:bold;
width:100%;
}

.copy-btn{
background:linear-gradient(135deg,#ff9800,#ff5722);
padding:12px;
border:none;
border-radius:10px;
color:#fff;
margin-top:10px;
width:100%;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/512px-Bitcoin.svg.png">
</div>

<button onclick="watchAd()" class="task-btn">
💰 Watch Ad & Earn (2X for 1 min)
</button>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:90px;height:90px;border-radius:50%;border:3px solid #ff9800;">
<h3 id="username"></h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>🔥 Social Tasks</h3>

<button class="task-btn" onclick="task('telegram')">Join Telegram</button>
<button class="task-btn" onclick="task('tiktok')">Follow TikTok</button>
<button class="task-btn" onclick="task('youtube')">Subscribe YouTube</button>

</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Withdraw Rules</h3>
<p>Minimum: 20 USDT</p>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

let coinsVal = 0;
let multiplier = 1;

// SCREEN SWITCH
function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

// TAP SYSTEM
tapArea.addEventListener("touchstart",(e)=>{
let f = e.touches?.length || 1;
f = Math.min(f,4);

coinsVal += f * multiplier;
coins.innerText = coinsVal;
});

// TASKS
function task(type){
let url=
type==="telegram"
?"https://t.me/example"
:type==="tiktok"
?"https://tiktok.com"
:"https://youtube.com";

window.open(url,"_blank");
}

// =========================
// MONETAG REWARDED ADS
// =========================

function watchAd(){

try{

if(typeof show_10892289 === "function"){

show_10892289().then(()=>{

let reward = 100 * multiplier;

coinsVal += reward;
coins.innerText = coinsVal;

alert("🎉 +" + reward + " coins earned");

// 2X BOOST
multiplier = 2;

setTimeout(()=>{
multiplier = 1;
alert("⏳ 2X ended");
},60000);

}).catch(()=>{
alert("❌ Ad not completed");
});

}

}catch(e){
console.log(e);
}

}

</script>

</body>
</html>
