<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Earn USDT Pro</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script
src='//libtl.com/sdk.js'
data-zone='10892289'
data-sdk='show_10892289'>
</script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.topbar{
background:#111827;
padding:15px;
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:#334155;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
}

.userinfo{
text-align:left;
}

.card{
background:#1e293b;
margin:15px;
padding:18px;
border-radius:15px;
}

.balance{
font-size:32px;
font-weight:bold;
color:#22c55e;
margin-top:10px;
}

button{
width:90%;
padding:15px;
margin:8px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.ad{
background:#22c55e;
color:white;
}

.bonus{
background:#3b82f6;
color:white;
}

.withdraw{
background:#f59e0b;
color:white;
}

input{
width:90%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-size:16px;
outline:none;
}

</style>

</head>

<body>

<!-- PROFILE -->
<div class="topbar">

<div class="avatar" id="avatar">
U
</div>

<div class="userinfo">

<div id="tgname">
Telegram User
</div>

<small>
ID:
<span id="uid"></span>
</small>

</div>

</div>

<!-- BALANCE -->
<div class="card">

<h2>💰 Your Balance</h2>

<div class="balance">
$<span id="usdt">0.00</span>
</div>

<p>
🪙 Coins:
<span id="coins">0</span>
</p>

<p>
🏆 Level:
<span id="level">Bronze</span>
</p>

</div>

<!-- ADS -->
<button class="ad" onclick="watchAd()">
▶ Watch Ad +0.03$
</button>

<!-- BONUS -->
<button class="bonus" onclick="bonus()">
🎁 Daily Bonus +0.01$
</button>

<!-- WITHDRAW -->
<div class="card">

<h3>💸 Withdraw</h3>

<input
id="wallet"
placeholder="USDT Wallet Address">

<input
id="amount"
placeholder="Amount">

<button
class="withdraw"
onclick="withdrawNow()">
Withdraw
</button>

</div>

<script>

// ================= TELEGRAM USER =================

let userId = "guest";
let tgName = "Telegram User";
let avatar = "U";

if(window.Telegram && Telegram.WebApp){

  Telegram.WebApp.ready();

  const tgUser =
    Telegram.WebApp.initDataUnsafe.user;

  if(tgUser){

    userId = tgUser.id;

    tgName =
      tgUser.username
      ? "@"+tgUser.username
      : tgUser.first_name || "Telegram User";

    avatar =
      tgName
      .replace("@","")
      .charAt(0)
      .toUpperCase();
  }
}

document.getElementById("uid").innerText =
  userId;

document.getElementById("tgname").innerText =
  tgName;

document.getElementById("avatar").innerText =
  avatar;

// ================= LOAD PROFILE =================

async function load(){

  try{

    let res = await fetch(
      "/profile/" +
      userId +
      "/" +
      encodeURIComponent(tgName)
    );

    let d = await res.json();

    document.getElementById("usdt").innerText =
      Number(d.usdt || 0).toFixed(2);

    document.getElementById("coins").innerText =
      d.coins || 0;

    document.getElementById("level").innerText =
      d.level || "Bronze";

  }catch(err){

    console.log(err);
  }
}

load();

// ================= WATCH ADS =================

async function watchAd(){

  try{

    // show rewarded ad
    await show_10892289();

    // reward user
    let res = await fetch("/ads",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        userId
      })
    });

    let d = await res.json();

    if(d.success){

      document.getElementById("usdt").innerText =
        Number(d.usdt).toFixed(2);

      document.getElementById("coins").innerText =
        d.coins;

      alert("🎉 +0.03 USDT Added!");

      load();

    }else{

      alert(d.message || "Reward failed");
    }

  }catch(err){

    console.log(err);

    // SDK sometimes throws error even after ad watched
    // so reward once anyway

    let res = await fetch("/ads",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        userId
      })
    });

    let d = await res.json();

    if(d.success){

      document.getElementById("usdt").innerText =
        Number(d.usdt).toFixed(2);

      document.getElementById("coins").innerText =
        d.coins;

      alert("🎉 Reward Added!");

      load();
    }
  }
}

// ================= BONUS =================

async function bonus(){

  let res = await fetch("/bonus",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      userId
    })
  });

  let d = await res.json();

  alert(d.message);

  load();
}

// ================= WITHDRAW =================

async function withdrawNow(){

  let wallet =
    document.getElementById("wallet").value;

  let amount =
    document.getElementById("amount").value;

  let res = await fetch("/withdraw",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      userId,
      wallet,
      amount:Number(amount)
    })
  });

  let d = await res.json();

  alert(d.message);
}

</script>

</body>
</html>
