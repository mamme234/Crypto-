<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Tap Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);
color:white;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
padding:14px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid gold;
}

/* STATS */
.stats{
display:flex;
justify-content:space-around;
margin-top:10px;
}

.box{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:14px;
width:40%;
text-align:center;
}

.box strong{
display:block;
font-size:20px;
color:#facc15;
}

/* TAP */
.tap{
display:flex;
justify-content:center;
margin-top:60px;
}

.tap button{
width:210px;
height:210px;
border-radius:50%;
border:none;
font-size:22px;
background:radial-gradient(circle,#ffe066,#facc15);
box-shadow:0 0 40px rgba(250,204,21,0.6);
}

/* SCREEN */
.screen{
display:none;
padding:15px;
}

.active{display:block;}

/* CARDS */
.card{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:12px;
margin-top:10px;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.6);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
border:none;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div class="user">
<img id="photo">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Lv <span id="level">1</span></div>
</div>

<div class="stats">
<div class="box">Coins<strong id="coins">0</strong></div>
<div class="box">USDT<strong id="usdt">0.000</strong></div>
</div>

<div class="tap">
<button id="tapBtn">TAP</button>
</div>

</div>

<!-- PROFILE (WITHDRAW + ADS + TASKS) -->
<div id="profile" class="screen">

<h2>👤 Profile</h2>

<p id="pName"></p>
<p id="pUser"></p>

<!-- REF -->
<div class="card">
<h3>🔗 Referral</h3>
<input id="refLink" readonly style="width:100%;padding:10px">
<button onclick="copyRef()" style="width:100%;margin-top:5px">
Copy Link
</button>
</div>

<!-- SOCIAL TASKS -->
<div class="card">
<h3>🔥 Social Tasks</h3>
<button onclick="openTask('telegram')">Join Telegram (+500)</button>
<button onclick="openTask('youtube')">Subscribe YouTube (+1000)</button>
<button onclick="openTask('tiktok')">Follow TikTok (+700)</button>
</div>

<!-- ADS -->
<div class="card">
<h3>💰 Ads Reward</h3>
<button onclick="watchAd()">Watch Ad</button>
</div>

<!-- WITHDRAW (INSIDE PROFILE) -->
<div class="card">
<h3>💸 Withdraw</h3>
<p>Min: 20 USDT</p>

<input id="wallet" placeholder="Wallet address" style="width:100%;padding:10px">
<input id="amount" placeholder="Amount USDT" style="width:100%;padding:10px">

<button onclick="withdraw()" style="width:100%;margin-top:5px">
Withdraw
</button>
</div>

</div>

<!-- DEPOSIT (ONLY HERE) -->
<div id="withdraw" class="screen">

<h2>💰 Deposit</h2>

<input id="depWallet" readonly style="width:100%;padding:10px"
value="UQAYjMccjJ8Xn1z9hodUImMjJCB2qmWGjlMup9-sVZtEQFWH">

<button onclick="copyWallet()" style="width:100%;margin-top:10px">
Copy Deposit Address
</button>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Deposit</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

let state = {
coins:0,
usdt:0
};

/* ELEMENTS */
const coinsEl = document.getElementById("coins");
const usdtEl = document.getElementById("usdt");
const tapBtn = document.getElementById("tapBtn");

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* UPDATE */
function render(){
coinsEl.innerText = Math.floor(state.coins);
usdtEl.innerText = state.usdt.toFixed(3);
}

/* TELEGRAM */
const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

if(user){

document.getElementById("name").innerText=user.first_name;
document.getElementById("uname").innerText="@"+(user.username||"user");

document.getElementById("pName").innerText="Name: "+user.first_name;
document.getElementById("pUser").innerText="ID: "+user.id;

document.getElementById("refLink").value=
"https://t.me/Studybuddy_2025Bot?start="+user.id;

if(user.photo_url){
document.getElementById("photo").src=user.photo_url;
}
}

/* TAP */
tapBtn.addEventListener("touchstart",tap,{passive:false});
tapBtn.addEventListener("click",tap);

function tap(e){

e.preventDefault();

let fingers = e.touches ? Math.min(e.touches.length,4) : 1;

state.coins += fingers;
state.usdt = state.coins / 1000;

document.getElementById("level").innerText =
Math.floor(state.coins / 5000) + 1;

render();
}

/* TASKS */
function openTask(type){

if(type==="telegram") window.open("https://t.me/Studybuddy_2025Bot","_blank");
if(type==="youtube") window.open("https://youtube.com","_blank");
if(type==="tiktok") window.open("https://tiktok.com","_blank");

setTimeout(()=>{
state.coins += (type==="telegram"?500:type==="youtube"?1000:700);
state.usdt = state.coins / 1000;
render();
alert("Reward added!");
},4000);

}

/* ADS */
function watchAd(){
alert("Ad watched +300 coins");
state.coins += 300;
state.usdt = state.coins / 1000;
render();
}

/* WITHDRAW */
function withdraw(){

let w = document.getElementById("wallet").value;
let a = parseFloat(document.getElementById("amount").value);

if(a < 20){
alert("Minimum 20 USDT");
return;
}

if(a > state.usdt){
alert("Not enough balance");
return;
}

alert("Withdraw request sent!");
}

/* COPY */
function copyRef(){
navigator.clipboard.writeText(document.getElementById("refLink").value);
alert("Copied");
}

function copyWallet(){
navigator.clipboard.writeText(document.getElementById("depWallet").value);
alert("Copied");
}

render();

</script>

</body>
  </html>
