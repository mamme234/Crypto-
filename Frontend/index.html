<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Earn App</title>

<script>
/* CRASH PROTECTION */
window.onerror = function(){ return true; };
window.onunhandledrejection = function(){ return true; };

/* SAFE ADS (ONLY IN CHROME, NOT TELEGRAM) */
try {
if (!window.Telegram || !window.Telegram.WebApp) {
let ad = document.createElement("script");
ad.src = "https://quge5.com/88/tag.min.js";
ad.setAttribute("data-zone","230862");
ad.async = true;
document.head.appendChild(ad);
}
} catch(e){}
</script>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
overflow:hidden;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:linear-gradient(145deg,#1a1a1a,#0a0a0a);
padding:15px;
margin:10px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,180,0,0.2);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{text-align:center;}
.stat strong{
display:block;
font-size:22px;
color:#ff9800;
}

/* TAP */
.tap{
width:260px;
height:260px;
margin:20px auto;
display:flex;
align-items:center;
justify-content:center;
touch-action:none;
}

.tap img{
width:230px;
height:230px;
border-radius:50%;
box-shadow:0 0 40px rgba(255,200,0,0.8);
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#020617;
}

.nav button{
flex:1;
padding:12px;
border:none;
background:#111;
color:#fff;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="card grid">
<div class="stat">Coins<strong id="coins">0</strong></div>
<div class="stat">USDT<strong id="usdt">0</strong></div>
<div class="stat">Refs<strong id="refs">0</strong></div>
<div class="stat">Level<strong id="level">1</strong></div>
</div>

<div class="tap" id="tapArea">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg">
</div>

<div style="text-align:center;font-size:12px;color:#aaa">
1 finger = 1 coin | max 4 fingers
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="card" style="text-align:center">
<img id="photo" style="width:80px;height:80px;border-radius:50%">
<h3 id="username">User</h3>
<p id="userid"></p>
</div>

<div class="card">
<h3>Referral</h3>
<p id="refLink">Loading...</p>
<button onclick="copyRef()">Copy Link</button>
</div>

<div class="card">
<h3>Social Tasks</h3>
<button onclick="task('telegram')">Join Telegram</button>
<button onclick="task('tiktok')">Follow TikTok</button>
<button onclick="task('youtube')">Subscribe YouTube</button>
</div>

</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">

<div class="card">
<h3>Withdraw Rules</h3>
<p>Minimum withdraw: 20 USDT</p>
<p>Need 10 referrals OR deposit 5 USDT</p>
</div>

<div class="card">
<input id="wAddress" placeholder="Wallet address" style="width:100%;padding:10px;">
<input id="wAmount" placeholder="Amount" style="width:100%;padding:10px;margin-top:10px;">
<button onclick="withdraw()">Submit</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

let API="https://crypto-4bbj.onrender.com";
let token=localStorage.getItem("token");

let coinsVal=0, usdtVal=0, refsVal=0;

function show(s){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* TELEGRAM SAFE */
const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg) tg.expand();

const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
? tg.initDataUnsafe.user
: {id:"0",first_name:"User"};

/* LOGIN */
if(user && !token){
fetch(API+"/api/tg-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id:user.id,
name:user.first_name
})
})
.then(r=>r.json())
.then(d=>{
localStorage.setItem("token",d.token);
location.reload();
});
}

/* LOAD */
async function load(){
try{
const res = await fetch(API+"/api/user",{headers:{Authorization:"Bearer "+token}});
const u = await res.json();

coinsVal=u.coins||0;
usdtVal=u.usdt||0;
refsVal=u.referrals||0;

coins.innerText=coinsVal;
usdt.innerText=usdtVal;
refs.innerText=refsVal;

level.innerText=Math.floor((coinsVal+usdtVal*1000)/1000)+1;

userid.innerText="ID: "+user.id;

refLink.innerText="https://t.me/YourBot?start="+user.id;

}catch(e){}
}

/* TAP FIX */
document.addEventListener("touchstart",(e)=>{

try{
let fingers = e.touches ? e.touches.length : 1;
if(fingers>4) fingers=4;

coinsVal += fingers;

coins.innerText=coinsVal;

}catch(e){}

});

/* SOCIAL TASK FIXED */
function task(type){

let url =
type==="telegram"
?"https://t.me/gangs234"
:type==="tiktok"
?"https://tiktok.com/@mammeliyas"
:"https://youtube.com/@Mamme234";

const tg = window.Telegram?.WebApp;

if(tg && tg.openLink){
tg.openLink(url);
}else{
window.open(url,"_blank");
}

setTimeout(()=>{

let reward=0;
if(type==="telegram") reward=500;
if(type==="tiktok") reward=1000;
if(type==="youtube") reward=1250;

coinsVal+=reward;

coins.innerText=coinsVal;

alert("Task completed +"+reward);

},5000);

}

/* COPY */
function copyRef(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}

/* WITHDRAW */
function withdraw(){
alert("Request sent");
}

load();

</script>

</body>
  </html>
