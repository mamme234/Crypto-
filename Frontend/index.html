<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(180deg,#0b1220,#020617);
color:#fff;
text-align:center;
}

.screen{display:none;padding:15px;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.06);
padding:16px;
margin:15px;
border-radius:16px;
}

.tap{
width:160px;
height:160px;
border-radius:50%;
margin:20px auto;
background:radial-gradient(circle,#ff9800,#ff5722);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

button{
width:90%;
padding:12px;
border:none;
border-radius:12px;
margin-top:10px;
background:#229ED9;
color:#fff;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="screen active">
<div class="card">
<h2>Login with Telegram</h2>

<script async src="https://telegram.org/js/telegram-widget.js?22"
data-telegram-login="YOUR_BOT_USERNAME"
data-size="large"
data-userpic="false"
data-auth-url="https://YOUR-BACKEND.onrender.com/api/auth/telegram">
</script>

</div>
</div>

<!-- HOME -->
<div id="home" class="screen">
<div class="card">
<h3>User: <span id="name"></span></h3>
<h3>Coins: <span id="coins">0</span></h3>
<h3>USDT: <span id="usdt">0</span></h3>
<h3>Refs: <span id="refs">0</span></h3>
</div>

<div class="tap" onclick="tap()">TAP</div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="screen">
<div class="card">
<h3>Withdraw</h3>
<p id="status"></p>
</div>

<button onclick="withdraw()">Request Withdraw</button>
</div>

<script>

const API="https://YOUR-BACKEND.onrender.com";
let token = new URLSearchParams(location.search).get("token") 
|| localStorage.getItem("token");

if(token) localStorage.setItem("token",token);

/* LOAD USER */
async function load(){

const res = await fetch(API+"/api/user",{
headers:{Authorization:"Bearer "+token}
});

const u = await res.json();

if(!u || u.message) return;

name.innerText = u.name;
coins.innerText = u.coins;
usdt.innerText = u.usdt;
refs.innerText = u.referrals;
}

/* TAP */
async function tap(){
const res = await fetch(API+"/api/tap",{
method:"POST",
headers:{Authorization:"Bearer "+token}
});

const data = await res.json();
if(data.coins !== undefined){
coins.innerText = data.coins;
}
}

/* WITHDRAW */
async function withdraw(){

const address = prompt("Wallet address");
const amount = prompt("Amount");

const res = await fetch(API+"/api/withdraw",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({address,amount})
});

const data = await res.json();
alert(data.message);
}

load();

</script>

</body>
</html>
