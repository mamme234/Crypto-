<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Tap Pro</title>

<script src="https://wrathful-piano.com/b.3/VH0/PJ3vpMv/btmOVbJDZbDp0/2sO/Tag/4rOCD/AmxiLtTMYQ5/OUD/gf4sM/DlUC"></script>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle at top,#1b2a4a,#050914 70%);
color:white;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.user img{
width:48px;
height:48px;
border-radius:50%;
border:2px solid #facc15;
box-shadow:0 0 15px rgba(250,204,21,0.5);
}

.stats{
display:flex;
justify-content:space-around;
margin-top:12px;
}

.box{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:14px;
width:40%;
text-align:center;
backdrop-filter:blur(8px);
}

.box strong{
display:block;
font-size:20px;
color:#facc15;
}

.tap{
display:flex;
justify-content:center;
margin-top:70px;
}

.tap button{
width:220px;
height:220px;
border-radius:50%;
border:none;
font-size:22px;
font-weight:bold;
color:#111;
background:radial-gradient(circle,#ffe066,#facc15);
box-shadow:0 0 40px rgba(250,204,21,0.6);
}

.screen{
display:none;
padding:15px;
animation:fade 0.2s ease;
}

.active{display:block;}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:rgba(0,0,0,0.6);
}

.nav button{
flex:1;
padding:12px;
background:none;
color:white;
border:none;
}

.profileCard{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:18px;
margin-top:10px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
}

.profileHeader{
display:flex;
align-items:center;
gap:10px;
}

.profileHeader img{
width:60px;
height:60px;
border-radius:50%;
border:2px solid gold;
}

.badge{
background:gold;
color:black;
padding:3px 8px;
border-radius:10px;
font-size:12px;
margin-left:10px;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.08);
color:white;
margin-top:8px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

<div class="topbar">
<div class="user">
<img id="photo">
<div>
<div id="name">User</div>
<div id="uname">@user</div>
</div>
</div>
<div>Lv <span id="level">1</span></div>
</div>

<div class="stats">
<div class="box">Coins<strong id="coins">0</strong></div>
<div class="box">USDT<strong id="usdt">0.000</strong></div>
</div>

<div class="tap">
<button id="tapBtn">TAP</button>
</div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

<div class="profileCard">
<div class="profileHeader">
<img id="pPhoto">
<div>
<h3 id="pName">User</h3>
<span class="badge">VIP Player</span>
</div>
</div>
<p id="pUser"></p>
</div>

<div class="profileCard">
<h3>🔗 Referral Link</h3>
<input id="refLink" readonly>
<button onclick="copyRef()" style="width:100%">Copy Link</button>
</div>

<div class="profileCard">
<h3>💰 Ads </h3>
<button onclick="watchAd()">🎁 Watch Ad & Earn</button>
</div>

<div class="profileCard">
<h3>💸 Withdraw</h3>
<input id="wallet" placeholder="Wallet address">
<input id="amount" placeholder="Amount USDT">
<button onclick="withdraw()" style="width:100%">Withdraw</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('profile')">Profile</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const API = "https://crypto-4bbj.onrender.com";
const API_POST = "https://my-channel-1.onrender.com/post";

let state = { coins:0, usdt:0, referrals:0 };
const DAILY_LIMIT = 5000;

const tg = window.Telegram?.WebApp;
const user = tg?.initDataUnsafe?.user;

if(tg) tg.expand();

/* SEND UPDATE */
async function sendUpdate(message){
  try{
    await fetch(API_POST,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message})
    });
  }catch(e){}
}

/* DAILY */
function getToday(){
  return new Date().toISOString().split("T")[0];
}

function getDaily(){
  let d = JSON.parse(localStorage.getItem("dailyTap")||"{}");
  if(d.date !== getToday()) d={date:getToday(),coins:0};
  return d;
}

function saveDaily(d){
  localStorage.setItem("dailyTap",JSON.stringify(d));
}

/* RENDER */
function render(){
  coins.innerText=Math.floor(state.coins);
  usdt.innerText=state.usdt.toFixed(3);
}

/* LOAD USER */
async function loadUser(){
  if(!user) return;

  let res=await fetch(API+"/user/"+user.id);
  let data=await res.json();

  state.coins=data.coins;
  state.usdt=data.usdt;
  state.referrals=data.referrals||0;

  render();
}

/* TAP FIXED */
let lastTap=0;
let lastPost=0;

function tap(e){
  if(e) e.preventDefault();

  let now=Date.now();
  if(now-lastTap<80) return;
  lastTap=now;

  let fingers=e?.touches?Math.min(e.touches.length,4):1;

  let d=getDaily();

  if(d.coins>=DAILY_LIMIT){
    alert("Limit reached");
    return;
  }

  d.coins+=fingers;
  saveDaily(d);

  state.coins+=fingers;
  state.usdt+=fingers*0.001;

  render();

  if(state.coins>=lastPost+100){
    lastPost=state.coins;
    sendUpdate("🔥 Player reached "+Math.floor(state.coins));
  }

  fetch(API+"/tap",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user?.id||0,fingers})
  });
}

/* WATCH AD */
let adRun=false,lastAd=0;

function watchAd(){
  if(adRun) return alert("Wait");
  if(Date.now()-lastAd<30000) return alert("Cooldown");

  lastAd=Date.now();
  adRun=true;

  let w=window.open("https://wrathful-piano.com/...");

  if(!w){adRun=false;return alert("Popup blocked");}

  setTimeout(()=>{
    state.coins+=50;
    state.usdt+=0.005;
    render();
    sendUpdate("🎁 Ad reward");
    adRun=false;
  },6000);
}

/* WITHDRAW RULE */
async function withdraw(){
  let wallet=wallet.value;
  let amount=parseFloat(document.getElementById("amount").value);

  if(amount<20) return alert("Min 20 USDT");
  if(state.referrals<10) return alert("Need 10 refs");

  let res=await fetch(API+"/withdraw",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user.id,wallet,amount})
  });

  let data=await res.json();
  alert(data.message);
}

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* COPY */
function copyRef(){
  navigator.clipboard.writeText(refLink.value);
  alert("Copied");
}

/* USER UI */
if(user){
  name.innerText=user.first_name;
  uname.innerText="@"+(user.username||"user");
  pName.innerText=user.first_name;
  pUser.innerText="ID: "+user.id;
}

/* START */
loadUser();

tapBtn.onclick=tap;
tapBtn.ontouchstart=tap;
</script>

</body>
</html>
